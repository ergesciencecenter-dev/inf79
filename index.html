<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Информатика 7–9: практикум</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2433;--mute:#5d6678;--line:#dde2ea;--acc:#1f6feb;--acc2:#e8f0fe;--ok:#1a7f37;--okbg:#e6f4ea;--bad:#c62828;--badbg:#fdecea;--warn:#9a6700;--warnbg:#fff4d6}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
header .brand{font-weight:700;cursor:pointer}
header .sp{flex:1}
header .who{color:var(--mute);font-size:14px}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 4px}h2{font-size:20px;margin:24px 0 8px}h3{font-size:17px;margin:16px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.mute{color:var(--mute)}.small{font-size:14px}
button,.btn{font:inherit;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer}
button.sec{background:#fff;color:var(--acc)}button.ghost{background:none;border-color:var(--line);color:var(--ink)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;border:1px solid #c3cad6;border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:80px}
label{display:block;margin:8px 0 4px;font-size:14px;color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:#fff;color:var(--ink);padding:5px 10px}
.seg button.on{background:var(--acc);color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{background:#fff;color:var(--ink);border-color:var(--line)}
.tabs button.on{background:var(--acc2);color:var(--acc);border-color:var(--acc)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.work{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.work.soon{cursor:default;opacity:.55}
.num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;background:#eef1f5;color:var(--mute);margin-right:4px}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}
.bar{height:6px;background:#eef1f5;border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.theory p{margin:6px 0}
.example{background:#f8fafc;border-left:4px solid var(--acc);padding:8px 12px;border-radius:6px}
.level{border-top:2px solid var(--line);margin-top:20px;padding-top:6px}
.lvl-h{display:flex;align-items:center;gap:8px}
.lvl-h .tag{font-size:13px}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:#fff}
.item .q{margin-bottom:8px}
.fb{margin-top:8px;padding:6px 10px;border-radius:6px;font-size:14px}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}.fb.info{background:#eef1f5;color:var(--mute)}
table.tt{border-collapse:collapse;margin:4px 0}
table.tt th,table.tt td{border:1px solid var(--line);padding:4px 8px;text-align:center}
table.tt th{background:#f3f5f8;font-weight:600}
table.tt input{width:44px;text-align:center;padding:4px}
input.right{border-color:var(--ok);background:var(--okbg)}input.wrong{border-color:var(--bad);background:var(--badbg)}
.opts label{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:16px;margin:4px 0;cursor:pointer}
.match td{padding:4px 8px}
.sheetwrap{overflow-x:auto}
table.sheet{border-collapse:collapse;font-size:14px}
table.sheet th{background:#f3f5f8;border:1px solid var(--line);padding:2px 6px;font-weight:500;color:var(--mute);min-width:28px}
table.sheet td{border:1px solid var(--line);padding:0}
table.sheet input{border:0;border-radius:0;width:118px;padding:4px 6px;font-size:14px}
table.sheet td[data-a^="A"] input{width:170px}
table.sheet td.lock input{background:#f8fafc;color:#333}
table.sheet td.cur input{outline:2px solid var(--acc);outline-offset:-2px}
table.sheet td.right input{background:var(--okbg)}table.sheet td.wrong input{background:var(--badbg)}
.fbar{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap;font-size:14px}
.fbar code{background:#f3f5f8;padding:2px 6px;border-radius:4px;min-width:160px}
.modal{position:fixed;inset:0;background:rgba(20,25,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:20}
.modal .box{background:#fff;border-radius:12px;max-width:820px;width:100%;padding:20px}
table.matrix{border-collapse:collapse;font-size:14px}
table.matrix th,table.matrix td{border:1px solid var(--line);padding:4px 6px;text-align:center;white-space:nowrap}
table.matrix td.name{text-align:left}
table.matrix td.cell{cursor:pointer}table.matrix td.cell:hover{background:var(--acc2)}
.err{color:var(--bad);font-size:14px;margin-top:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.score{font-weight:700}

/* --- эргономика --- */
.theory p,.q,.example,.card>p{max-width:75ch}
.opts label{min-height:44px;align-items:center;padding:6px 8px;border-radius:8px;border:1px solid transparent}
.opts label:hover{background:#f3f6fb}
.opts input{width:22px;height:22px;flex:none;margin:0}
button,select{min-height:40px}
input.wrong,select.wrong{border:2px dashed var(--bad)}input.right,select.right{border:2px solid var(--ok)}
table.sheet td.wrong input{box-shadow:inset 0 0 0 2px var(--bad)}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.jump button{background:#fff;color:var(--ink);border-color:var(--line);min-height:36px;padding:4px 12px;font-size:14px}
.breakbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:30;background:#fff8e1;border:1px solid #f0c36d;border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.12);max-width:640px;margin:0 auto}
.autosave{font-size:13px;color:var(--mute)}
@media (max-width:640px){
 header{position:static;padding:8px 12px;gap:8px}
 header .who{order:5;width:100%;font-size:13px}
 header .seg button{padding:4px 8px;min-height:34px}
 #logout{min-height:34px;padding:4px 10px}
 main{padding:10px}
 h1{font-size:21px}
 .card{padding:12px}
 table.sheet input{width:84px}
 table.sheet td[data-a^="A"] input{width:112px}
 table.tt input{width:48px;height:40px}
}

/* --- графика и цвет --- */
body{background:linear-gradient(180deg,#f3f6ff 0,#f6f7f9 320px)}
.hero{border-radius:16px;padding:18px 20px;margin:8px 0 12px;display:flex;gap:16px;align-items:center;color:#1d2433}
.hero .big{flex:none;width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px}
.hero h1{margin:0}
.lineTag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:2px 10px;margin-top:4px}
.wcard{background:#fff;border-radius:16px;border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column}
.wcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(30,40,80,.12)}
.wcard.soon{cursor:default;opacity:.6;filter:grayscale(.5)}.wcard.soon:hover{transform:none;box-shadow:none}
.wcard .top{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#fff}
.wcard .top .n{font-size:30px;font-weight:800;opacity:.95}
.wcard .body{padding:12px 16px 14px;flex:1}
.stars{color:#f59f00;font-size:18px;letter-spacing:2px}.stars .off{color:#d5dae2}
.greet{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:8px 0 14px}
.bubble{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.lvlband{border-radius:12px;padding:8px 14px;color:#fff;display:flex;align-items:center;gap:10px;margin-top:22px}
.lvlband h3{margin:0;color:#fff}
.lvlband .tag{background:rgba(255,255,255,.25);color:#fff}
.level{border-top:0;margin-top:0;padding-top:0}
.illus{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:10px 0 14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;width:136px;font-size:13px;font-weight:600}
.tile svg{display:block;margin:0 auto 6px}
table.elim{border-collapse:separate;border-spacing:4px}
table.elim td,table.elim th{width:44px;height:36px;text-align:center;border-radius:8px;font-weight:700}
table.elim th{background:none;color:var(--mute);font-weight:600}
table.elim td.y{background:#d3f9d8;color:#2b8a3e}table.elim td.n{background:#ffe3e3;color:#c92a2a}
table.elim td.nm{width:auto;padding:0 10px;text-align:left;background:#f1f3f5;color:#1d2433}
.fbm{display:flex;align-items:center;gap:8px}
.hintbtn{background:#fff8e1;border-color:#f0c36d;color:#8a5a00}
.hint{background:#fff8e1;border-radius:8px;padding:8px 12px;margin-top:8px;font-size:15px}
.example{border-left-width:6px}
.confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:50;border-radius:2px;animation:fall 1.6s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.8}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.wcard{transition:none}}
pre.out{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:14px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;margin:6px 0;max-width:75ch}
textarea.code{font:15px/1.5 ui-monospace,Consolas,monospace;background:#fbfcfe;tab-size:4;min-height:150px}
.q pre.out{margin-top:8px}
@media print{header,.noprint{display:none!important}.modal{position:static;background:none;padding:0}.modal .box{max-width:none;padding:0}}
</style>
</head>

<p><b>ЭМЕС</b> (¬A, инверсия) маанини тескерисине өзгөртөт.<br><b>ЖАНА</b> (A ∧ B, конъюнкция) эки айтым тең чын болгондо гана чын.<br><b>ЖЕ</b> (A ∨ B, дизъюнкция) эки айтым тең жалган болгондо гана жалган.</p>
<p>Аракеттердин тартиби: кашаалар → ЭМЕС → ЖАНА → ЖЕ.</p>
<p><b>Чындык таблицасы</b> өзгөрмөлөрдүн бардык маанилер топтомун камтыйт: 2 өзгөрмө үчүн — 4 сап, 3 өзгөрмө үчүн — 8 сап (2ⁿ). Топтомдорду экилик сандар катары ирети менен жазуу ыңгайлуу: 00, 01, 10, 11.</p>`),

Выражение истинно только в одной строке: A = 1, B = 0.`,

{id:"7-2",n:2,code:"7.A1",illus:l=>ILL.elim(l),title:R("Логические задачи и проверка рассуждений","Логикалык маселелер жана ой жүгүртүүнү текшерүү"),
 goal:R("Применять логические операции для решения задач и проверять корректность рассуждений.","Маселелерди чечүү үчүн логикалык операцияларды колдонуу жана ой жүгүртүүнүн тууралыгын текшерүү."),
 theory:R(`<p>Многие логические задачи решаются <b>перебором вариантов</b>: перечисляем все возможные случаи и для каждого проверяем, выполняются ли условия. Удобно записывать варианты в таблицу.</p>
<p>Условие из нескольких частей вычисляется по правилам логических операций. Например, «НЕ(X чётное) И (X > 5)» истинно для 7, но ложно для 8 (первая часть ложна) и для 3 (вторая часть ложна).</p>
<p>Рассуждение <b>корректно</b>, если вывод обязательно следует из посылок. Типичная ошибка — «обратный вывод»: из «все кошки — млекопитающие» не следует, что любое млекопитающее — кошка.</p>`,
`<p>Көптөгөн логикалык маселелер <b>варианттарды иргөө</b> менен чечилет: бардык мүмкүн болгон учурларды тизмектеп, ар бири үчүн шарттар аткарылабы — текшеребиз. Варианттарды таблицага жазуу ыңгайлуу.</p>
<p>Бир нече бөлүктөн турган шарт логикалык операциялардын эрежелери боюнча эсептелет. Мисалы, «ЭМЕС(X жуп) ЖАНА (X > 5)» 7 үчүн чын, бирок 8 үчүн (биринчи бөлүгү жалган) жана 3 үчүн (экинчи бөлүгү жалган) жалган.</p>
<p>Ой жүгүртүү <b>туура</b>, эгерде корутунду өбөлгөлөрдөн сөзсүз келип чыкса. Кеңири таралган ката — «тескери корутунду»: «бардык мышыктар — сүт эмүүчүлөр» дегенден ар кандай сүт эмүүчү мышык экени келип чыкпайт.</p>`),
 example:R(`Задача: «Айдай, Бермет и Гуля заняли 1, 2 и 3 места. Айдай не первая, Гуля не первая и не третья». Перебор: Гуля может быть только второй. Тогда первое место — у Бермет (Айдай не первая), а Айдай — третья. Проверяем все условия — выполнены.`,
`Маселе: «Айдай, Бермет жана Гүлө 1, 2 жана 3-орундарды ээлешти. Айдай биринчи эмес, Гүлө биринчи да, үчүнчү да эмес». Иргөө: Гүлө экинчи гана боло алат. Анда биринчи орун — Берметте (Айдай биринчи эмес), Айдай — үчүнчү. Бардык шарттарды текшеребиз — аткарылды.`),

{id:"7-3",n:3,code:"7.A2",illus:l=>ILL.models(l),title:R("Информационные модели: таблица, граф, схема","Маалыматтык моделдер: таблица, граф, схема"),
 goal:R("Различать виды моделей, работать с моделью-графом и оценивать точность модели.","Моделдердин түрлөрүн айырмалоо, граф-модель менен иштөө жана моделдин тактыгын баалоо."),
 theory:R(`<p><b>Модель</b> — упрощённое представление объекта, процесса или явления, в котором сохранены свойства, важные для цели моделирования.</p>
<p><b>Материальные (натурные)</b> модели можно потрогать: глобус, макет. <b>Информационные</b> модели описывают объект знаками: словесные, <b>табличные</b> (расписание), <b>графические</b> (карта, схема, чертёж, граф), <b>математические</b> (формулы).</p>
<p><b>Граф</b> состоит из вершин (объектов) и рёбер (связей). Если у рёбер есть числа — длины, цены, время, — граф называют <b>взвешенным</b>. По нему можно найти кратчайший путь.</p>
<p>Любая модель неполна: она не учитывает часть свойств реального объекта. Поэтому результат модели надо сравнивать с реальностью и оценивать <b>погрешность</b>.</p>`,
`<p><b>Модель</b> — объекттин, процесстин же кубулуштун жөнөкөйлөштүрүлгөн көрүнүшү, анда моделдөөнүн максаты үчүн маанилүү касиеттер сакталат.</p>
<p><b>Материалдык (заттык)</b> моделдерди кармап көрүүгө болот: глобус, макет. <b>Маалыматтык</b> моделдер объектти белгилер менен сүрөттөйт: сөз менен, <b>таблицалык</b> (сабактардын жүгүртмөсү), <b>графикалык</b> (карта, схема, чийме, граф), <b>математикалык</b> (формулалар).</p>
<p><b>Граф</b> чокулардан (объекттерден) жана кабыргалардан (байланыштардан) турат. Эгерде кабыргаларда сандар — узундук, баа, убакыт — болсо, граф <b>салмактуу</b> деп аталат. Ал боюнча эң кыска жолду табууга болот.</p>
<p>Ар кандай модель толук эмес: ал чыныгы объекттин касиеттеринин бир бөлүгүн эске албайт. Ошондуктан моделдин жыйынтыгын чындык менен салыштырып, <b>катаны</b> баалоо керек.</p>`),

 goal:R("Научиться вводить формулы, копировать их, использовать функции и строить диаграмму.","Формулаларды киргизүүнү, көчүрүүнү, функцияларды колдонууну жана диаграмма түзүүнү үйрөнүү."),
 sheets:{s1:{rows:7,cols:2,lock:LOCK_BUDGET},s2:{rows:8,cols:4,lock:LOCK_MONTHS,chart:true}},
 theory:R(`<p>Электронная таблица состоит из <b>ячеек</b>. Адрес ячейки — буква столбца и номер строки: <b>B3</b>.</p>
<p><b>Формула</b> начинается со знака <b>=</b> и содержит числа, адреса ячеек и знаки действий: <code>=B2*B3</code>. Если изменить число в ячейке, формула пересчитается сама.</p>
<p><b>Функции</b>: <code>=СУММ(C2:C7)</code> — сумма диапазона, <code>СРЗНАЧ</code> — среднее, <code>МАКС</code>, <code>МИН</code>. Запись <b>C2:C7</b> — диапазон ячеек от C2 до C7.</p>
<p>При копировании формулы вниз адреса <b>сдвигаются</b>: <code>=B2*50</code> в строке 3 станет <code>=B3*50</code>. Чтобы адрес не менялся, ставят знак $: <code>$B$1</code>.</p>
<p><b>Диаграмма</b> наглядно показывает, как меняются данные.</p>`,
`<p>Электрондук таблица <b>уячалардан</b> турат. Уячанын дареги — мамычанын тамгасы жана саптын номери: <b>B3</b>.</p>
<p><b>Формула</b> <b>=</b> белгисинен башталат жана сандарды, уячалардын даректерин жана амалдардын белгилерин камтыйт: <code>=B2*B3</code>. Уячадагы санды өзгөртсөңүз, формула өзү кайра эсептелет.</p>
<p><b>Функциялар</b>: <code>=СУММ(C2:C7)</code> — диапазондун суммасы, <code>СРЗНАЧ</code> — орточо, <code>МАКС</code>, <code>МИН</code>. <b>C2:C7</b> жазуусу — C2ден C7ге чейинки уячалар диапазону.</p>
<p>Формуланы төмөн көчүргөндө даректер <b>жылат</b>: 3-саптагы <code>=B2*50</code> <code>=B3*50</code> болуп калат. Дарек өзгөрбөшү үчүн $ белгисин коёт: <code>$B$1</code>.</p>
<p><b>Диаграмма</b> маалыматтардын кантип өзгөрөрүн көрсөтмө түрдө көрсөтөт.</p>`),
 example:R(`Чтобы посчитать стоимость 3 кг картошки по 35 сом: в A1 пишем 3, в A2 — 35, в A3 — формулу <code>=A1*A2</code>. В ячейке появится 105. Если цена станет 40, достаточно изменить A2 — результат пересчитается сам: 120.`,
`35 сомдон 3 кг картөшкөнүн баасын эсептөө үчүн: A1ге 3, A2ге — 35, A3кө — <code>=A1*A2</code> формуласын жазабыз. Уячада 105 пайда болот. Эгерде баа 40 болсо, A2ни өзгөртүү жетиштүү — жыйынтык өзү кайра эсептелет: 120.`),

"7-4":{illus:l=>ILL.flow(l,[R("Ввод|клавиатура, мышь","Киргизүү|баскычтоп, чычкан"),R("Процессор|вычисляет","Процессор|эсептейт"),R("ОЗУ|временно","ОЭТ|убактылуу"),R("SSD / флеш|надолго","SSD / флеш|узак убакыт"),R("Вывод|экран, звук","Чыгаруу|экран, үн")],"#0c8599"),
 goal:R("Понять, как процессор, память и операционная система работают вместе, и сравнить компьютер со смартфоном.","Процессор, эс тутум жана операциялык система кантип чогуу иштээрин түшүнүү жана компьютерди смартфон менен салыштыруу."),
 theory:R(`<p><b>Процессор</b> выполняет команды программ и обрабатывает данные. Его скорость зависит от <b>тактовой частоты</b> (ГГц — миллиарды тактов в секунду) и числа <b>ядер</b>: несколько ядер выполняют разные задачи одновременно.</p>
<p><b>Оперативная память (ОЗУ)</b> хранит программы и данные, с которыми процессор работает сейчас. Она быстрая, но при выключении питания всё в ней стирается. Чем больше ОЗУ, тем больше программ и вкладок можно держать открытыми без «тормозов».</p>
<p><b>Долговременная память</b> (SSD, жёсткий диск, флеш-память телефона) хранит файлы годами. 1 ГБ = 1024 МБ.</p>
<p><b>Операционная система</b> (Windows, Linux, Android, iOS) управляет устройствами, памятью и запуском программ.</p>
<p>В смартфоне процессор, графика и контроллеры объединены в одной микросхеме — <b>SoC</b> («система на кристалле»). Поэтому телефон тонкий и экономно расходует заряд, но обычно слабее компьютера в тяжёлых задачах.</p>`,
`<p><b>Процессор</b> программалардын буйруктарын аткарат жана маалыматтарды иштетет. Анын ылдамдыгы <b>такт жыштыгынан</b> (ГГц — секундасына миллиард такт) жана <b>өзөктөрдүн</b> санынан көз каранды: бир нече өзөк ар башка тапшырмаларды бир убакта аткарат.</p>
<p><b>Оперативдик эс тутум (ОЭТ)</b> процессор азыр иштеп жаткан программаларды жана маалыматтарды сактайт. Ал ылдам, бирок ток өчкөндө андагы баары өчөт. ОЭТ канчалык көп болсо, ошончолук көп программаны жана өтмөктү «тормозсуз» ачык кармоого болот.</p>
<p><b>Узак мөөнөттүү эс тутум</b> (SSD, катуу диск, телефондун флеш-эси) файлдарды жылдар бою сактайт. 1 ГБ = 1024 МБ.</p>
<p><b>Операциялык система</b> (Windows, Linux, Android, iOS) түзмөктөрдү, эс тутумду жана программаларды иштетүүнү башкарат.</p>
<p>Смартфондо процессор, графика жана контроллерлер бир микросхемага бириктирилген — <b>SoC</b> («кристаллдагы система»). Ошондуктан телефон жука жана заряды үнөмдүү, бирок оор тапшырмаларда адатта компьютерден алсызыраак.</p>`),
 example:R(`Вы открыли браузер с 20 вкладками, и компьютер стал медленным. Процессор загружен не полностью, а ОЗУ занято на 95 %. Значит, не хватает оперативной памяти: система начинает переносить данные на диск, а диск намного медленнее ОЗУ. Решение — закрыть лишние вкладки или добавить ОЗУ.`,
`Браузерди 20 өтмөк менен ачтыңыз, компьютер жайлап калды. Процессор толук жүктөлгөн эмес, ал эми ОЭТ 95 % ээленген. Демек, оперативдик эс тутум жетишпейт: система маалыматтарды дискке көчүрө баштайт, ал эми диск ОЭТтен алда канча жай. Чечим — ашыкча өтмөктөрдү жабуу же ОЭТ кошуу.`),

 theory:R(`<p><b>Искусственный интеллект (ИИ)</b> — программы, которые учатся на большом количестве примеров (данных) и находят в них закономерности. Так работают переводчики, распознавание лиц, голосовые помощники, рекомендации видео, чат-боты.</p>
<p>ИИ-чат подбирает <b>правдоподобный</b> текст по образцам, которые видел при обучении. Он не «знает» факты как человек и может уверенно сказать неправду — это называют <b>галлюцинацией</b>. Если в данных были ошибки или предвзятость, ИИ может их повторить.</p>
<p><b>Правила:</b> проверяйте важные факты в надёжных источниках (учебник, официальные сайты); не вводите личные данные (адрес, фото документов, пароли); не выдавайте текст ИИ за свой — честно указывайте, что пользовались ИИ; советы о здоровье и деньгах проверяйте у специалистов.</p>`,
`<p><b>Жасалма интеллект (ЖИ)</b> — көп сандагы мисалдардан (маалыматтардан) үйрөнүп, алардан мыйзам ченемдерди тапкан программалар. Котормочулар, бет таануу, үн жардамчылары, видео сунуштары, чат-боттор ушундай иштейт.</p>
<p>ЖИ-чат үйрөнүүдө көргөн үлгүлөр боюнча <b>чындыкка окшош</b> текстти тандайт. Ал фактыларды адамдай «билбейт» жана калпты ишенимдүү айтып коюшу мүмкүн — муну <b>галлюцинация</b> дешет. Эгерде маалыматтарда каталар же бир жактуулук болсо, ЖИ аларды кайталашы мүмкүн.</p>
<p><b>Эрежелер:</b> маанилүү фактыларды ишенимдүү булактардан текшериңиз (окуу китеби, расмий сайттар); жеке маалыматтарды (дарек, документтердин сүрөтү, сырсөздөр) киргизбеңиз; ЖИнин текстин өзүңүздүкү катары бербеңиз — ЖИни колдонгонуңузду чынчылдык менен көрсөтүңүз; ден соолук жана акча боюнча кеңештерди адистерден текшериңиз.</p>`),

 goal:R("Научиться создавать переменные, различать типы данных, вводить и выводить данные в Python.","Python тилинде өзгөрмөлөрдү түзүүнү, маалымат түрлөрүн айырмалоону, маалыматтарды киргизүүнү жана чыгарууну үйрөнүү."),
 theory:R(`<p><b>Переменная</b> — именованная «коробка» для значения: <code>a = 5</code>. Знак <code>=</code> означает «положить значение в коробку».</p>
<p><b>Типы данных:</b> <code>int</code> — целые числа (<code>7</code>), <code>float</code> — дробные (<code>3.5</code>, через точку!), <code>str</code> — строки в кавычках (<code>"Ош"</code>). <code>"12"</code> в кавычках — это строка, а не число.</p>
<p><b>Вывод:</b> <code>print(a, b)</code> печатает значения через пробел. <b>Ввод:</b> <code>input()</code> всегда возвращает строку, поэтому число читают так: <code>n = int(input())</code>.</p>
<p><b>Арифметика:</b> <code>+ - * /</code>, <code>//</code> — целая часть от деления, <code>%</code> — остаток, <code>**</code> — степень. Для строк <code>+</code> склеивает: <code>"5" + "3"</code> → <code>53</code>.</p>`,
`<p><b>Өзгөрмө</b> — маани үчүн аты бар «куту»: <code>a = 5</code>. <code>=</code> белгиси «маанини кутуга салуу» дегенди билдирет.</p>
<p><b>Маалымат түрлөрү:</b> <code>int</code> — бүтүн сандар (<code>7</code>), <code>float</code> — бөлчөк сандар (<code>3.5</code>, чекит аркылуу!), <code>str</code> — тырмакчадагы саптар (<code>"Ош"</code>). Тырмакчадагы <code>"12"</code> — сан эмес, сап.</p>
<p><b>Чыгаруу:</b> <code>print(a, b)</code> маанилерди боштук аркылуу басып чыгарат. <b>Киргизүү:</b> <code>input()</code> дайыма сап кайтарат, ошондуктан санды мындай окушат: <code>n = int(input())</code>.</p>
<p><b>Арифметика:</b> <code>+ - * /</code>, <code>//</code> — бөлүүнүн бүтүн бөлүгү, <code>%</code> — калдык, <code>**</code> — даража. Саптар үчүн <code>+</code> бириктирет: <code>"5" + "3"</code> → <code>53</code>.</p>`),

"7-7":{illus:l=>ILL.ifchart(l),
 goal:R("Научиться писать программы с ветвлениями if, elif, else и проверять их на граничных значениях.","if, elif, else тармактануулары менен программаларды жазууну жана аларды чек ара маанилеринде текшерүүнү үйрөнүү."),
 theory:R(`<p><b>Ветвление</b> выбирает, какие команды выполнить, в зависимости от условия:</p>
<pre class="out">if условие:
    команды, если условие истинно
elif другое_условие:
    команды, если истинно второе
else:
    команды во всех остальных случаях</pre>
<p><b>Сравнения:</b> <code>==</code> равно, <code>!=</code> не равно, <code>&lt; &gt; &lt;= &gt;=</code>. Одно <code>=</code> — это присваивание, а не сравнение!</p>
<p>Условия соединяют логическими операциями из ПР-1: <code>and</code> (И), <code>or</code> (ИЛИ), <code>not</code> (НЕ).</p>
<p>Команды внутри ветки пишут с <b>отступом</b> 4 пробела — так Python понимает, что они относятся к условию.</p>
<p>Проверяйте программу на <b>граничных значениях</b>: если условие <code>age &lt; 7</code>, проверьте 6, 7 и 8.</p>`,

    print(i)</pre>
<p><code>range(a, b)</code> даёт числа от a до b−1; <code>range(n)</code> — от 0 до n−1; <code>range(a, b, шаг)</code> — с шагом.</p>
<p><b>while</b> повторяет, пока условие истинно. Важно, чтобы условие когда-нибудь стало ложным, иначе цикл будет бесконечным.</p>
<pre class="out">x = 1
while x < 100:
    x = x * 2</pre>
<p><b>Накопление:</b> сумму считают так: <code>s = 0</code> до цикла и <code>s = s + i</code> (или <code>s += i</code>) внутри цикла.</p>`,
`<p><b>Цикл</b> буйруктарды кайталайт. Кайталоолордун саны белгилүү болгондо <b>for</b> колдонулат:</p>
<pre class="out">for i in range(1, 6):   # i = 1, 2, 3, 4, 5
    print(i)</pre>
<p><code>range(a, b)</code> a дан b−1ге чейинки сандарды берет; <code>range(n)</code> — 0дөн n−1ге чейин; <code>range(a, b, кадам)</code> — кадам менен.</p>
<p><b>while</b> шарт чын болгонго чейин кайталайт. Шарт качандыр бир кезде жалган болушу маанилүү, болбосо цикл түбөлүктүү болот.</p>
<pre class="out">x = 1
while x < 100:
    x = x * 2</pre>
<p><b>Топтоо:</b> сумманы мындай эсептешет: циклге чейин <code>s = 0</code>, циклдин ичинде <code>s = s + i</code> (же <code>s += i</code>).</p>`),

<p><b>Риски:</b> ссылка «все, у кого есть ссылка, могут редактировать» может попасть к чужим людям; кто-то может случайно удалить данные; нельзя размещать в общих документах личные данные (телефоны, адреса).</p>
<p>Давайте минимальный нужный доступ, используйте надёжный пароль и двухэтапную проверку аккаунта.</p>`,
`<p><b>Булут</b> — файлдарды сактоо жана программаларды интернеттеги серверлерде иштетүү. Документ каалаган түзмөктөн жеткиликтүү, автоматтык түрдө сакталат, аны менен бир убакта бир нече адам иштей алат, ал эми версиялардын тарыхы өчүрүлгөндү кайтарууга мүмкүндүк берет.</p>
<p><b>Кирүү деңгээлдери:</b> <b>көрүү</b> — окууга гана болот; <b>комментарий берүү</b> — текстти өзгөртпөй, пикир калтырууга болот; <b>түзөтүү</b> — өзгөртүүгө болот.</p>
<p><b>Тобокелдиктер:</b> «шилтемеси бар бардыгы түзөтө алат» деген шилтеме бөтөн адамдарга тийип калышы мүмкүн; кимдир бирөө маалыматтарды кокустан өчүрүп салышы мүмкүн; жалпы документтерге жеке маалыматтарды (телефондор, даректер) жайгаштырууга болбойт.</p>
<p>Керектүү минималдуу кирүү укугун бериңиз, ишенимдүү сырсөз жана аккаунттун эки баскычтуу текшерүүсүн колдонуңуз.</p>`),

<p><b>Авторское право:</b> используйте свои фото, изображения со свободной лицензией (Creative Commons) и всегда указывайте источники на последнем слайде.</p>

<p><b>Жасалгалоо эрежелери:</b> бир слайд — бир ой; 5–6 саптан ашпаган текст; ири шрифт (аталыш 32 pt дан, текст 20 pt дан); текст менен фондун контрасты; бүт ишке 1–2 шрифт; бардык слайддардын бирдей жасалгасы.</p>
<p><b>Автордук укук:</b> өз сүрөттөрүңүздү, эркин лицензиядагы (Creative Commons) сүрөттөрдү колдонуңуз жана акыркы слайдда булактарды дайыма көрсөтүңүз.</p>

 theory:R(`<p><b>Фишинг</b> — попытка выманить пароли, коды или деньги под видом банка, магазина, друга или учителя. <b>Признаки:</b> срочность и угрозы («карта заблокирована!»), обещание выигрыша, просьба перейти по странной ссылке, назвать код из SMS или перевести деньги, ошибки в адресе сайта.</p>
<p><b>Правило:</b> код из SMS и пароль никогда никому не сообщают — даже «сотруднику банка» или другу. Сомневаетесь — позвоните в организацию по официальному номеру.</p>
<p><b>Надёжный пароль:</b> длинный (от 12 символов), с буквами разного регистра, цифрами и знаками; не содержит имени и даты рождения; для каждого сайта свой. Удобно составить пароль из нескольких слов: <code>Kok-Jaiyk!Tash_47</code>.</p>
<p>Включайте <b>двухэтапную проверку</b>: даже зная пароль, злоумышленник не войдёт без кода с вашего телефона.</p>`,
`<p><b>Фишинг</b> — банк, дүкөн, дос же мугалим болуп көрүнүп, сырсөздөрдү, коддорду же акчаны алдап алууга аракет. <b>Белгилери:</b> шаштыруу жана коркутуу («карта бөгөттөлдү!»), утуш убадасы, кызык шилтемеге өтүүнү, SMSтеги кодду айтууну же акча которууну суроо, сайттын дарегиндеги каталар.</p>
<p><b>Эреже:</b> SMSтеги кодду жана сырсөздү эч качан эч кимге айтышпайт — «банктын кызматкерине» же досуна да. Шектенсеңиз — уюмга расмий номер аркылуу чалыңыз.</p>
<p><b>Ишенимдүү сырсөз:</b> узун (12 белгиден), ар кандай регистрдеги тамгалар, цифралар жана белгилер менен; атты жана туулган күндү камтыбайт; ар бир сайт үчүн өзүнчө. Сырсөздү бир нече сөздөн түзүү ыңгайлуу: <code>Kok-Jaiyk!Tash_47</code>.</p>
<p><b>Эки баскычтуу текшерүүнү</b> күйгүзүңүз: сырсөздү билсе да, кылмышкер телефонуңуздагы кодсуз кире албайт.</p>`),

<p><b>Из двоичной в десятичную:</b> умножаем каждую цифру на 2 в степени её номера (справа, начиная с 0) и складываем: 1101₂ = 8 + 4 + 0 + 1 = 13.</p>
<p><b>Из десятичной в двоичную:</b> делим на 2 и записываем остатки снизу вверх: 13 → 6 (1) → 3 (0) → 1 (1) → 0 (1) → 1101₂.</p>
<p><b>Шестнадцатеричная</b> система: цифры 0–9 и A=10, B=11, … F=15. Одна шестнадцатеричная цифра = 4 бита: FF₁₆ = 15·16 + 15 = 255.</p>`,

<p><b>Экиликтен ондукка:</b> ар бир цифраны 2нин анын номериндей (оңдон, 0дөн баштап) даражасына көбөйтүп, кошобуз: 1101₂ = 8 + 4 + 0 + 1 = 13.</p>

 theory:R(`<p><b>Сложение в двоичной системе:</b> 0+0=0, 0+1=1, 1+1=10 (пишем 0, переносим 1), 1+1+1=11. Складываем столбиком справа налево, как в десятичной.</p>
<p><b>Вычитание:</b> 1−0=1, 1−1=0, 10−1=1 (занимаем единицу из старшего разряда).</p>
<p><b>Цвет на экране</b> складывается из трёх лучей: красного (R), зелёного (G), синего (B). Яркость каждого — от 0 до 255, то есть 1 байт. В веб-дизайне цвет записывают кодом <b>HEX</b>: #RRGGBB, например #FF0000 — красный, #FFFFFF — белый, #000000 — чёрный. На один пиксель — 3 байта = 24 бита, всего 2²⁴ ≈ 16,7 млн цветов.</p>`,

<p><b>Кемитүү:</b> 1−0=1, 1−1=0, 10−1=1 (улук разряддан бирди карызга алабыз).</p>
<p><b>Экрандагы түс</b> үч нурдан түзүлөт: кызыл (R), жашыл (G), көк (B). Ар биринин жарыктыгы — 0дөн 255ке чейин, башкача айтканда 1 байт. Веб-дизайнда түстү <b>HEX</b> коду менен жазышат: #RRGGBB, мисалы #FF0000 — кызыл, #FFFFFF — ак, #000000 — кара. Бир пикселге — 3 байт = 24 бит, бардыгы 2²⁴ ≈ 16,7 млн түс.</p>`),

{id:"8-3",n:3,code:"8.A2",title:R("Логические схемы: элементы И, ИЛИ, НЕ","Логикалык схемалар: ЖАНА, ЖЕ, ЭМЕС элементтери"),illus:l=>ILL.gates(l),
 goal:R("Научиться читать логические схемы, строить для них таблицы истинности и понимать, где они используются.","Логикалык схемаларды окууну, алар үчүн чындык таблицаларын түзүүнү жана алар кайда колдонуларын түшүнүүнү үйрөнүү."),
 theory:R(`<p>Внутри процессора миллиарды крошечных переключателей — <b>логических элементов</b>. Они работают с сигналами 1 и 0 по правилам логики из 7 класса.</p>
<p>На схемах элементы рисуют прямоугольниками: <b>&amp;</b> — элемент И (конъюнктор), <b>1</b> — элемент ИЛИ (дизъюнктор), <b>1 с кружком</b> на выходе — элемент НЕ (инвертор).</p>
<p>Чтобы найти, что выдаёт схема, вычисляем значения по шагам от входов к выходу и записываем таблицу истинности.</p>
<p>Из простых элементов собирают сложные: например, «исключающее ИЛИ» (A ⊕ B = (A ∨ B) ∧ ¬(A ∧ B)) лежит в основе <b>сумматора</b>, который складывает двоичные числа.</p>`,
`<p>Процессордун ичинде миллиарддаган кичинекей которгучтар — <b>логикалык элементтер</b> бар. Алар 7-класстагы логиканын эрежелери боюнча 1 жана 0 сигналдары менен иштешет.</p>
<p>Схемаларда элементтерди тик бурчтуктар менен тартышат: <b>&amp;</b> — ЖАНА элементи (конъюнктор), <b>1</b> — ЖЕ элементи (дизъюнктор), чыгышында <b>тегерекчеси бар 1</b> — ЭМЕС элементи (инвертор).</p>
<p>Схема эмне берерин табуу үчүн маанилерди кирүүлөрдөн чыгышка карай кадам менен эсептеп, чындык таблицасын жазабыз.</p>
<p>Жөнөкөй элементтерден татаалдарын чогултушат: мисалы, «бөлүп алуучу ЖЕ» (A ⊕ B = (A ∨ B) ∧ ¬(A ∧ B)) экилик сандарды кошкон <b>сумматордун</b> негизинде жатат.</p>`),
 example:R(`Схема: A и B идут на элемент &amp;, его выход и C — на элемент 1. Значит, F = (A ∧ B) ∨ C. При A=1, B=0, C=1: A ∧ B = 0, 0 ∨ 1 = 1 → F = 1.`,
`Схема: A жана B &amp; элементине барат, анын чыгышы жана C — 1 элементине. Демек, F = (A ∧ B) ∨ C. A=1, B=0, C=1 болгондо: A ∧ B = 0, 0 ∨ 1 = 1 → F = 1.`),
 levels:[
  [{id:"a",type:"match",pts:2,q:R("Какой элемент обозначен на схеме знаком?","Схемада белги менен кайсы элемент белгиленген?"),rows:[R("&","&"),R("1","1"),R("1 с кружком на выходе","Чыгышында тегерекчеси бар 1")],opts:[R("И","ЖАНА"),R("ИЛИ","ЖЕ"),R("НЕ","ЭМЕС")],ans:[0,1,2]},
   {id:"b",type:"choice",pts:2,q:R("Выход элемента равен 1 только тогда, когда на всех входах 1. Что это за элемент?","Элементтин чыгышы бардык кирүүлөрдө 1 болгондо гана 1ге барабар. Бул кайсы элемент?"),opts:[R("И","ЖАНА"),R("ИЛИ","ЖЕ"),R("НЕ","ЭМЕС")],ans:0}],
  [{id:"c",type:"tt",pts:3,vars:["A","B","C"],cols:[{h:"A ∧ B",f:(a,b)=>a&b},{h:"F = (A ∧ B) ∨ C",f:(a,b,c)=>(a&b)|c}],q:R("Схема из примера: F = (A ∧ B) ∨ C. Заполните таблицу истинности.","Мисалдагы схема: F = (A ∧ B) ∨ C. Чындык таблицасын толтуруңуз."),hint:R("Если C = 1, то F = 1 при любых A и B.","C = 1 болсо, A жана B кандай болбосун F = 1.")}],
  [{id:"d",type:"tt",pts:2,vars:["A","B"],cols:[{h:"A ∨ B",f:(a,b)=>a|b},{h:"¬(A ∧ B)",f:(a,b)=>1-(a&b)},{h:"A ⊕ B",f:(a,b)=>a^b}],q:R("Соберите «исключающее ИЛИ»: A ⊕ B = (A ∨ B) ∧ ¬(A ∧ B). Заполните таблицу.","«Бөлүп алуучу ЖЕни» чогултуңуз: A ⊕ B = (A ∨ B) ∧ ¬(A ∧ B). Таблицаны толтуруңуз.")},
   {id:"e",type:"choice",pts:1,q:R("Заметьте: A ⊕ B — это последняя цифра суммы A + B. Где используется такая схема?","Байкаңыз: A ⊕ B — A + B суммасынын акыркы цифрасы. Мындай схема кайда колдонулат?"),opts:[R("В сумматоре процессора","Процессордун сумматорунда"),R("В мониторе для яркости","Монитордо жарыктык үчүн"),R("В клавиатуре","Баскычтопто")],ans:0},
   {id:"f",type:"text",q:R("Нарисуйте (в тетради или в редакторе) схему для F = ¬A ∨ (B ∧ C) и опишите её словами.","F = ¬A ∨ (B ∧ C) үчүн схеманы тартып (дептерде же редактордо), аны сөз менен сүрөттөңүз.")}]
 ]},
{id:"8-4",n:4,code:"8.A3",title:R("Компьютерная модель в таблице: рост отары","Таблицадагы компьютердик модель: отардын өсүшү"),illus:l=>ILL.flow(l,[R("Объект|отара","Объект|отар"),R("Формула|N·1,2 − 5","Формула|N·1,2 − 5"),R("Таблица|по годам","Таблица|жылдар боюнча"),R("Эксперимент|что если…","Эксперимент|эгерде…"),R("Выводы","Корутунду")],"#5b5bd6"),
 sheets:{h:{rows:12,cols:4,lock:LOCK_HERD,chart:true,chartDef:["A2:A12","B2:B12"]}},
 goal:R("Построить компьютерную модель процесса в электронной таблице, провести эксперимент и оценить ограничения модели.","Электрондук таблицада процесстин компьютердик моделин түзүү, эксперимент жүргүзүү жана моделдин чектөөлөрүн баалоо."),
 theory:R(`<p><b>Компьютерная модель</b> — формулы, по которым компьютер рассчитывает, как процесс меняется во времени. Этапы: постановка задачи → формализация (формула) → расчёт в таблице → <b>вычислительный эксперимент</b> («что будет, если…») → анализ.</p>
<p>Модель отары: каждый год приплод — 20 % (умножаем на 1,2), продают 5 голов. Значит, N(следующий год) = N · 1,2 − 5. В таблице: <code>=B2*1,2-5</code> → в Excel и LibreOffice с русскими настройками десятичный разделитель — запятая, а в нашем тренажёре пишите <b>1.2</b>.</p>
<p>Модель упрощает реальность: она не учитывает падёж скота, размер пастбища, цены. Поэтому выводы модели проверяют и уточняют.</p>`,
`<p><b>Компьютердик модель</b> — компьютер процесстин убакыт боюнча кантип өзгөрөрүн эсептеген формулалар. Баскычтары: маселени коюу → формалдаштыруу (формула) → таблицада эсептөө → <b>эсептөө эксперименти</b> («эгерде … эмне болот») → талдоо.</p>
<p>Отардын модели: ар жылы төл — 20 % (1,2ге көбөйтөбүз), 5 баш сатылат. Демек, N(кийинки жыл) = N · 1,2 − 5. Таблицада: <code>=B2*1.2-5</code>. Excel жана LibreOfficeто орусча жөндөөлөрдө ондук бөлгүч — үтүр, ал эми биздин тренажёрдо <b>1.2</b> деп жазыңыз.</p>
<p>Модель чындыкты жөнөкөйлөтөт: ал малдын кырылышын, жайыттын көлөмүн, бааларды эске албайт. Ошондуктан моделдин корутундуларын текшерип, тактап турушат.</p>`),
 example:R(`Год 0: 40 голов. Год 1: 40 · 1,2 − 5 = 43. Год 2: 43 · 1,2 − 5 = 46,6. Дробные головы в реальности не бывают, но модель показывает тенденцию — отара растёт всё быстрее.`,
`0-жыл: 40 баш. 1-жыл: 40 · 1,2 − 5 = 43. 2-жыл: 43 · 1,2 − 5 = 46,6. Чындыкта бөлчөк баш болбойт, бирок модель тенденцияны көрсөтөт — отар барган сайын тезирээк өсөт.`),
 levels:[

    q:R("Введите в B3 формулу модели и заполните её вниз до 10-го года (строка 12).","B3кө моделдин формуласын киргизип, аны 10-жылга чейин (12-сап) төмөн карай толтуруңуз."),hint:R("=B2*1.2-5, затем «Заполнить вниз» до строки 12.","=B2*1.2-5, андан кийин 12-сапка чейин «Төмөн карай толтуруу».")}],
  [{id:"b",type:"choice",pts:1,q:R("В каком году отара впервые превысит 60 голов?","Кайсы жылы отар биринчи жолу 60 баштан ашат?"),opts:[R("3","3"),R("4","4"),R("5","5"),R("6","6")],ans:2},
   {id:"c",type:"num",pts:1,ans:9,tol:0,q:R("В каком году отара впервые превысит 100 голов?","Кайсы жылы отар биринчи жолу 100 баштан ашат?")},
   {id:"d",type:"num",pts:1,ans:118,tol:0,q:R("Сколько голов будет через 10 лет? Округлите до целых.","10 жылдан кийин канча баш болот? Бүтүн санга чейин тегеректеңиз.")}],
  [{id:"e",type:"choice",pts:1,q:R("Эксперимент: продаём 8 голов в год (измените формулу). Что будет с отарой?","Эксперимент: жылына 8 баш сатабыз (формуланы өзгөртүңүз). Отар эмне болот?"),opts:[R("Будет быстро расти","Тез өсөт"),R("Останется 40 голов каждый год","Ар жылы 40 баш бойдон калат"),R("Исчезнет за 2 года","2 жылда жок болот")],ans:1,hint:R("40 · 1,2 − 8 = ?","40 · 1,2 − 8 = ?")},
   {id:"f",type:"num",pts:1,ans:7,tol:0,q:R("Эксперимент: продаём 10 голов в год. В каком году отара впервые станет меньше 20 голов?","Эксперимент: жылына 10 баш сатабыз. Кайсы жылы отар биринчи жолу 20 баштан аз болуп калат?"),hint:R("Формула =B2*1.2-10, заполните вниз и смотрите столбец B.","=B2*1.2-10 формуласын төмөн толтуруп, B мамычасын караңыз.")},
   {id:"g",type:"choice",pts:1,q:R("Какое ограничение модели самое важное для реального хозяйства?","Чыныгы чарба үчүн моделдин кайсы чектөөсү эң маанилүү?"),opts:[R("Модель не учитывает размер пастбища и корма","Модель жайыттын жана тоюттун көлөмүн эске албайт"),R("Модель написана в таблице","Модель таблицада жазылган"),R("Модель использует умножение","Модель көбөйтүүнү колдонот")],ans:0},
   {id:"h",type:"text",q:R("Как улучшить модель? Предложите, что ещё нужно учесть, и как это записать формулой.","Моделди кантип жакшыртууга болот? Дагы эмнени эске алуу керектигин жана аны формула менен кантип жазууну сунуштаңыз.")}]
 ]},
{id:"8-5",n:5,code:"8.B1",title:R("Сети и интернет: IP-адрес, скорость передачи","Тармактар жана интернет: IP-дарек, берүү ылдамдыгы"),illus:l=>ILL.flow(l,[R("Компьютер","Компьютер"),R("Роутер|Wi‑Fi","Роутер|Wi‑Fi"),R("Провайдер","Провайдер"),R("Интернет","Интернет"),R("Сервер|сайт","Сервер|сайт")],"#0c8599"),
 goal:R("Понять, как устроены сети и интернет, научиться проверять IP-адреса и рассчитывать время передачи данных.","Тармактар жана интернет кантип түзүлгөнүн түшүнүү, IP-даректерди текшерүүнү жана маалыматтарды берүү убактысын эсептөөнү үйрөнүү."),
 theory:R(`<p><b>Компьютерная сеть</b> — устройства, соединённые для обмена данными. <b>Локальная</b> сеть — в классе или доме, <b>глобальная</b> — интернет.</p>
<p>У каждого устройства в сети есть <b>IP-адрес</b> — четыре числа от 0 до 255 через точку: 192.168.1.10. Людям удобнее имена сайтов, поэтому служба <b>DNS</b> переводит имя (например, edu.gov.kg) в IP-адрес.</p>
<p><b>Устройства:</b> роутер соединяет домашнюю сеть с интернетом и раздаёт Wi‑Fi; коммутатор соединяет компьютеры в локальной сети; сервер хранит сайты и файлы.</p>
<p><b>Скорость передачи</b> измеряют в битах в секунду (Мбит/с). Время = объём : скорость. Не забудьте: 1 байт = 8 бит, значит, 1 МБ ≈ 8 Мбит.</p>
<p><b>HTTPS</b> (замок в адресной строке) шифрует данные между вами и сайтом.</p>`,
`<p><b>Компьютердик тармак</b> — маалымат алмашуу үчүн бириктирилген түзмөктөр. <b>Жергиликтүү</b> тармак — класста же үйдө, <b>глобалдык</b> — интернет.</p>
<p>Тармактагы ар бир түзмөктүн <b>IP-дареги</b> бар — чекит аркылуу 0дөн 255ке чейинки төрт сан: 192.168.1.10. Адамдарга сайттардын аттары ыңгайлуу, ошондуктан <b>DNS</b> кызматы атты (мисалы, edu.gov.kg) IP-дарекке которот.</p>
<p><b>Түзмөктөр:</b> роутер үй тармагын интернет менен байланыштырып, Wi‑Fi таратат; коммутатор жергиликтүү тармактагы компьютерлерди бириктирет; сервер сайттарды жана файлдарды сактайт.</p>
<p><b>Берүү ылдамдыгы</b> секундасына биттер менен (Мбит/с) ченелет. Убакыт = көлөм : ылдамдык. Унутпаңыз: 1 байт = 8 бит, демек, 1 МБ ≈ 8 Мбит.</p>
<p><b>HTTPS</b> (дарек сабындагы кулпу) сиз менен сайттын ортосундагы маалыматтарды шифрлейт.</p>`),
 example:R(`Файл 50 МБ, скорость интернета 10 Мбит/с. 50 МБ = 50 · 8 = 400 Мбит. Время = 400 : 10 = 40 секунд.`,
`Файл 50 МБ, интернеттин ылдамдыгы 10 Мбит/с. 50 МБ = 50 · 8 = 400 Мбит. Убакыт = 400 : 10 = 40 секунд.`),
 levels:[

 theory:R(`<p><b>Системное ПО</b> управляет компьютером: операционные системы (Windows, Linux, Android), драйверы, антивирусы и утилиты. <b>Прикладное ПО</b> решает задачи пользователя: текстовые редакторы, таблицы, браузеры, игры. <b>Инструментальное ПО</b> нужно для создания программ: IDLE (Python), Scratch, Code::Blocks.</p>
<p><b>Лицензия</b> — договор, который определяет, как можно использовать программу. <b>Свободное ПО</b> (LibreOffice, Linux, GIMP) можно бесплатно использовать, изучать и распространять. <b>Бесплатное (freeware)</b> — бесплатно, но код закрыт. <b>Коммерческое (проприетарное)</b> — нужно купить лицензию.</p>
<p>Взломанные («крякнутые») программы нарушают закон и часто содержат вирусы. Устанавливайте программы с официальных сайтов и магазинов приложений.</p>`,
`<p><b>Системалык ПК</b> компьютерди башкарат: операциялык системалар (Windows, Linux, Android), драйверлер, антивирустар жана утилиталар. <b>Колдонмо ПК</b> колдонуучунун маселелерин чечет: текст редакторлору, таблицалар, браузерлер, оюндар. <b>Инструменталдык ПК</b> программаларды түзүү үчүн керек: IDLE (Python), Scratch, Code::Blocks.</p>
<p><b>Лицензия</b> — программаны кантип колдонууга болорун аныктаган келишим. <b>Эркин ПКны</b> (LibreOffice, Linux, GIMP) акысыз колдонууга, изилдөөгө жана таратууга болот. <b>Акысыз (freeware)</b> — акысыз, бирок коду жабык. <b>Коммерциялык (проприетардык)</b> — лицензияны сатып алуу керек.</p>
<p>Бузулган («крякнутый») программалар мыйзамды бузат жана көбүнчө вирустарды камтыйт. Программаларды расмий сайттардан жана колдонмолор дүкөндөрүнөн орнотуңуз.</p>`),

 theory:R(`<p><b>Сложное условие</b> составляют из простых с помощью <code>and</code> (И), <code>or</code> (ИЛИ), <code>not</code> (НЕ). Порядок: сначала <code>not</code>, потом <code>and</code>, потом <code>or</code>; скобки меняют порядок.</p>
<p>Пример: число в диапазоне от 10 до 20: <code>10 &lt;= x and x &lt;= 20</code> (или коротко <code>10 &lt;= x &lt;= 20</code>).</p>
<p><b>Високосный год</b>: делится на 4 и не делится на 100, или делится на 400: <code>(y % 4 == 0 and y % 100 != 0) or y % 400 == 0</code>.</p>
<p>Результат сравнения — логическое значение <code>True</code> или <code>False</code> (тип <code>bool</code>).</p>`,
`<p><b>Татаал шартты</b> жөнөкөйлөрдөн <code>and</code> (ЖАНА), <code>or</code> (ЖЕ), <code>not</code> (ЭМЕС) аркылуу түзүшөт. Тартиби: адегенде <code>not</code>, андан кийин <code>and</code>, андан кийин <code>or</code>; кашаалар тартипти өзгөртөт.</p>
<p>Мисал: 10дон 20га чейинки аралыктагы сан: <code>10 &lt;= x and x &lt;= 20</code> (же кыскача <code>10 &lt;= x &lt;= 20</code>).</p>
<p><b>Кибис жыл</b>: 4кө бөлүнөт жана 100гө бөлүнбөйт, же 400гө бөлүнөт: <code>(y % 4 == 0 and y % 100 != 0) or y % 400 == 0</code>.</p>
<p>Салыштыруунун жыйынтыгы — <code>True</code> же <code>False</code> логикалык мааниси (<code>bool</code> түрү).</p>`),

 theory:R(`<p><b>Функция</b> — именованный кусок программы, который можно вызывать много раз. Это как рецепт: один раз записали — используем снова.</p>
<pre class="out">def square(n):       # n — параметр
    return n * n     # возвращаем результат

print(square(4))     # 16
print(square(5) + 1) # 26</pre>
<p><code>return</code> <b>возвращает</b> значение туда, откуда функцию вызвали, — его можно сохранить в переменную или использовать в выражении. <code>print</code> только показывает на экране.</p>
<p>Функции делают программу короче и понятнее, их легко проверять по отдельности.</p>`,
`<p><b>Функция</b> — программанын аты бар бөлүгү, аны көп жолу чакырууга болот. Бул рецепт сыяктуу: бир жолу жазып — кайра колдонобуз.</p>
<pre class="out">def square(n):       # n — параметр
    return n * n     # жыйынтыкты кайтарабыз

print(square(4))     # 16
print(square(5) + 1) # 26</pre>
<p><code>return</code> функция чакырылган жерге маанини <b>кайтарат</b> — аны өзгөрмөгө сактоого же туюнтмада колдонууга болот. <code>print</code> экранга көрсөтөт гана.</p>
<p>Функциялар программаны кыскараак жана түшүнүктүүрөөк кылат, аларды өзүнчө текшерүү оңой.</p>`),
 example:R(`Функция для площади прямоугольника:<pre class="out">def area(a, b):
    return a * b

print(area(3, 4) + area(2, 5))   # 12 + 10 = 22</pre>`,
`Тик бурчтуктун аянты үчүн функция:<pre class="out">def area(a, b):
    return a * b

print(area(3, 4) + area(2, 5))   # 12 + 10 = 22</pre>`),

{id:"8-9",n:9,code:"8.C1",title:R("Python: списки и строки","Python: тизмелер жана саптар"),illus:l=>ILL.list(l),
 goal:R("Научиться хранить данные в списках, обрабатывать их в цикле и работать со строками.","Маалыматтарды тизмелерде сактоону, аларды циклде иштетүүнү жана саптар менен иштөөнү үйрөнүү."),
 theory:R(`<p><b>Список</b> хранит много значений под одним именем: <code>marks = [5, 4, 5, 3]</code>. Элементы нумеруются с нуля: <code>marks[0]</code> → 5. <code>len(marks)</code> — длина, <code>marks.append(4)</code> — добавить в конец, <code>sum</code>, <code>max</code>, <code>min</code> — сумма, максимум, минимум.</p>
<p>Перебор: <code>for m in marks: …</code></p>
<p><b>Строка</b> — это последовательность символов: <code>s = "Бишкек"</code>, <code>s[0]</code> → «Б», <code>len(s)</code> → 6. <b>Срез</b> <code>s[0:3]</code> → «Биш» (символы 0, 1, 2). Методы: <code>s.upper()</code>, <code>s.lower()</code>, <code>s.count("к")</code>.</p>`,
`<p><b>Тизме</b> бир ат менен көп маанини сактайт: <code>marks = [5, 4, 5, 3]</code>. Элементтер нөлдөн номерленет: <code>marks[0]</code> → 5. <code>len(marks)</code> — узундугу, <code>marks.append(4)</code> — аягына кошуу, <code>sum</code>, <code>max</code>, <code>min</code> — сумма, максимум, минимум.</p>
<p>Иргөө: <code>for m in marks: …</code></p>
<p><b>Сап</b> — символдордун ырааттуулугу: <code>s = "Бишкек"</code>, <code>s[0]</code> → «Б», <code>len(s)</code> → 6. <b>Кесинди</b> <code>s[0:3]</code> → «Биш» (0, 1, 2-символдор). Методдор: <code>s.upper()</code>, <code>s.lower()</code>, <code>s.count("к")</code>.</p>`),
 example:R(`Средняя оценка:<pre class="out">marks = [5, 4, 5, 3]
print(sum(marks) / len(marks))   # 4.25</pre>`,`Орточо баа:<pre class="out">marks = [5, 4, 5, 3]
print(sum(marks) / len(marks))   # 4.25</pre>`),
 levels:[
  [{id:"a",type:"str",pts:1,ans:["Биш"],q:R("Что выведет программа?\ns = \"Бишкек\"\nprint(s[0:3])","Программа эмне чыгарат?\ns = \"Бишкек\"\nprint(s[0:3])")},
   {id:"b",type:"str",pts:1,ans:["4"],q:R("Что выведет программа?\na = [3, 1, 2]\na.append(5)\nprint(len(a))","Программа эмне чыгарат?\na = [3, 1, 2]\na.append(5)\nprint(len(a))")},
   {id:"c",type:"str",pts:1,ans:["2"],q:R("Что выведет программа?\na = [7, 2, 9]\nprint(a[1])","Программа эмне чыгарат?\na = [7, 2, 9]\nprint(a[1])"),hint:R("Нумерация с нуля.","Номерлөө нөлдөн.")},
   {id:"d",type:"str",pts:1,ans:["14"],q:R("Что выведет программа?\nb = [4, 1, 9]\nprint(sum(b) + min(b))","Программа эмне чыгарат?\nb = [4, 1, 9]\nprint(sum(b) + min(b))")}],
  [{id:"e",type:"code",pts:3,start:"n = int(input())\na = []\nfor i in range(n):\n    a.append(int(input()))\n",tests:[{in:"4\n5\n4\n5\n3",out:"5 3"},{in:"3\n2\n9\n7",out:"9 2"},{in:"1\n4",out:"4 4"}],q:R("Программа читает n, затем n оценок в список. Выведите через пробел наибольшую и наименьшую оценку.","Программа n ди, андан кийин n бааны тизмеге окуйт. Эң чоң жана эң кичине бааны боштук аркылуу чыгарыңыз.")}],
  [{id:"f",type:"code",pts:2,start:"s = input()\n",tests:[{in:"Бишкек",out:"2"},{in:"Ысык-Көл",out:"3"},{in:"Ала-Тоо",out:"4"},{in:"Чүй",out:"1"}],q:R("Посчитайте, сколько гласных букв в слове (русские и кыргызские гласные: аеёиоуыэюяөү, заглавные тоже).","Сөздө канча үндүү тамга бар экенин эсептеңиз (орус жана кыргыз үндүүлөрү: аеёиоуыэюяөү, баш тамгалар да)."),hint:R("Переведите слово в нижний регистр: s.lower(), затем переберите буквы и проверяйте: if ch in \"аеёиоуыэюяөү\".","Сөздү кичине тамгаларга которуңуз: s.lower(), андан кийин тамгаларды иргеп, текшериңиз: if ch in \"аеёиоуыэюяөү\".")},
   {id:"g",type:"str",pts:1,ans:["КЕЛ"],q:R("Что выведет программа?\nw = \"көл\"\nprint(w.upper().replace(\"Ө\", \"Е\"))","Программа эмне чыгарат?\nw = \"көл\"\nprint(w.upper().replace(\"Ө\", \"Е\"))")},

 ]},
{id:"8-10",n:10,code:"8.C1",title:R("Python: графика из символов и узоры","Python: символдордон графика жана оюулар"),illus:l=>`<pre class="out" style="font-size:16px;line-height:1.2">*
**
***
****      ####
*****     ####
          ####</pre>`,
 goal:R("Научиться строить изображения и узоры с помощью циклов и вложенных циклов.","Циклдердин жана уяча циклдердин жардамы менен сүрөттөрдү жана оюуларды түзүүнү үйрөнүү."),
 theory:R(`<p>Экран — это сетка из строк и столбцов. Рисуя символами, мы тренируем ту же логику, что и в компьютерной графике: каждая строка — это повтор символов.</p>
<p>Умножение строки на число повторяет её: <code>"*" * 4</code> → <code>****</code>.</p>
<p>Треугольник: <code>for i in range(1, n + 1): print("*" * i)</code>. Прямоугольник: <code>for i in range(h): print("#" * w)</code>.</p>
<p><b>Вложенный цикл</b> — цикл внутри цикла: внешний перебирает строки, внутренний — символы в строке. В IDLE можно рисовать и настоящую графику модулем <code>turtle</code> («черепашка»).</p>`,
`<p>Экран — саптардан жана мамычалардан турган тор. Символдор менен тартып, биз компьютердик графикадагыдай эле логиканы машыгабыз: ар бир сап — символдордун кайталанышы.</p>
<p>Сапты санга көбөйтүү аны кайталайт: <code>"*" * 4</code> → <code>****</code>.</p>
<p>Үч бурчтук: <code>for i in range(1, n + 1): print("*" * i)</code>. Тик бурчтук: <code>for i in range(h): print("#" * w)</code>.</p>
<p><b>Уяча цикл</b> — циклдин ичиндеги цикл: сырткысы саптарды, ичкиси саптагы символдорду иргейт. IDLEде <code>turtle</code> («ташбака») модулу менен чыныгы графиканы да тартууга болот.</p>`),
 example:R(`Лесенка из цифр:<pre class="out">for i in range(1, 4):
    print(str(i) * i)
# 1
# 22
# 333</pre>`,`Цифралардан тепкич:<pre class="out">for i in range(1, 4):
    print(str(i) * i)
# 1
# 22
# 333</pre>`),

{id:"8-11",n:11,code:"8.D1",title:R("База данных «Школьная библиотека»: запросы","«Мектеп китепканасы» маалымат базасы: суроо-талаптар"),illus:l=>ILL.dbtable(l),
 goal:R("Понять структуру базы данных и научиться выбирать, фильтровать и сортировать данные запросами SQL.","Маалымат базасынын түзүлүшүн түшүнүү жана SQL суроо-талаптары менен маалыматтарды тандоону, чыпкалоону жана иреттөөнү үйрөнүү."),
 theory:R(`<p><b>База данных</b> хранит сведения в <b>таблицах</b>. Строка таблицы — <b>запись</b> (одна книга), столбец — <b>поле</b> (название, автор, год). Поле, которое не повторяется (id), называют <b>ключом</b>.</p>
<p>Данные получают <b>запросами</b> на языке SQL:</p>
<pre class="out">SELECT title, year FROM books
WHERE year > 2015
ORDER BY year DESC
LIMIT 3</pre>
<p><code>SELECT</code> — какие поля показать (<code>*</code> — все), <code>WHERE</code> — условие отбора (с <code>AND</code>, <code>OR</code>; текст пишут в одинарных кавычках: <code>genre = 'сказки'</code>), <code>ORDER BY</code> — сортировка (<code>DESC</code> — по убыванию), <code>LIMIT</code> — сколько строк. <code>COUNT(*)</code> считает записи, <code>SUM</code>, <code>AVG</code>, <code>MAX</code>, <code>MIN</code> — сумма, среднее, максимум, минимум.</p>`,
`<p><b>Маалымат базасы</b> маалыматтарды <b>таблицаларда</b> сактайт. Таблицанын сабы — <b>жазуу</b> (бир китеп), мамычасы — <b>талаа</b> (аталышы, автору, жылы). Кайталанбаган талааны (id) <b>ачкыч</b> деп аташат.</p>
<p>Маалыматтарды SQL тилиндеги <b>суроо-талаптар</b> менен алышат:</p>
<pre class="out">SELECT title, year FROM books
WHERE year > 2015
ORDER BY year DESC
LIMIT 3</pre>
<p><code>SELECT</code> — кайсы талааларды көрсөтүү (<code>*</code> — баары), <code>WHERE</code> — тандоо шарты (<code>AND</code>, <code>OR</code> менен; текстти жалгыз тырмакчага жазышат: <code>genre = 'жомоктор'</code>), <code>ORDER BY</code> — иреттөө (<code>DESC</code> — кемүү боюнча), <code>LIMIT</code> — канча сап. <code>COUNT(*)</code> жазууларды эсептейт, <code>SUM</code>, <code>AVG</code>, <code>MAX</code>, <code>MIN</code> — сумма, орточо, максимум, минимум.</p>`),
 example:R(`Найти книги автора Н. Токтогулов: <code>SELECT title FROM books WHERE author = 'Н. Токтогулов'</code> → «Ысык-Көл сырлары», «Капчыгайдагы из».`,`Н. Токтогуловдун китептерин табуу: <code>SELECT title FROM books WHERE author = 'Н. Токтогулов'</code> → «Ысык-Көл сырлары», «Капчыгайдагы из».`),

{id:"8-12",n:12,code:"8.D2",title:R("Сайт на HTML и CSS","HTML жана CSS менен сайт"),illus:l=>ILL.flow(l,[R("HTML|структура","HTML|түзүлүш"),R("CSS|оформление","CSS|жасалга"),R("Браузер|показывает","Браузер|көрсөтөт")],"#d6336c"),
 goal:R("Понять устройство веб-страницы и создать свою страницу с заголовками, текстом, списком, картинкой, ссылкой и стилями.","Веб-барактын түзүлүшүн түшүнүү жана аталыштар, текст, тизме, сүрөт, шилтеме жана стилдер менен өз барагыңызды түзүү."),
 theory:R(`<p>Веб-страница пишется на языке разметки <b>HTML</b>. Он состоит из <b>тегов</b> в угловых скобках: <code>&lt;h1&gt;Заголовок&lt;/h1&gt;</code>. Большинство тегов парные: открывающий и закрывающий.</p>
<p>Основные теги: <code>&lt;h1&gt;…&lt;h3&gt;</code> — заголовки, <code>&lt;p&gt;</code> — абзац, <code>&lt;ul&gt;&lt;li&gt;</code> — список, <code>&lt;img src="фото.jpg" alt="описание"&gt;</code> — картинка (alt нужен незрячим и при ошибке загрузки), <code>&lt;a href="адрес"&gt;</code> — ссылка, <code>&lt;title&gt;</code> — название вкладки.</p>
<p><b>CSS</b> отвечает за оформление: <code>&lt;style&gt; h1 { color: #1971c2; } body { background: #f1f3f5; } &lt;/style&gt;</code>. Класс задаёт стиль группе элементов: <code>.note { color: red; }</code> и <code>&lt;p class="note"&gt;</code>.</p>
<p>Визуальные конструкторы сайтов делают то же самое, но код пишут за вас.</p>`,
`<p>Веб-барак <b>HTML</b> белгилөө тилинде жазылат. Ал бурчтуу кашаалардагы <b>тегдерден</b> турат: <code>&lt;h1&gt;Аталыш&lt;/h1&gt;</code>. Тегдердин көбү жуптуу: ачуучу жана жабуучу.</p>
<p>Негизги тегдер: <code>&lt;h1&gt;…&lt;h3&gt;</code> — аталыштар, <code>&lt;p&gt;</code> — абзац, <code>&lt;ul&gt;&lt;li&gt;</code> — тизме, <code>&lt;img src="сүрөт.jpg" alt="сүрөттөмө"&gt;</code> — сүрөт (alt көзү көрбөгөндөргө жана жүктөө катасында керек), <code>&lt;a href="дарек"&gt;</code> — шилтеме, <code>&lt;title&gt;</code> — өтмөктүн аталышы.</p>
<p><b>CSS</b> жасалга үчүн жооп берет: <code>&lt;style&gt; h1 { color: #1971c2; } body { background: #f1f3f5; } &lt;/style&gt;</code>. Класс элементтердин тобуна стиль берет: <code>.note { color: red; }</code> жана <code>&lt;p class="note"&gt;</code>.</p>
<p>Сайттардын визуалдык конструкторлору ушундай эле кылат, бирок кодду сиздин ордуңузга жазышат.</p>`),

&lt;p&gt;Наше село находится у подножия гор.&lt;/p&gt;
&lt;ul&gt;
  &lt;li&gt;Школа&lt;/li&gt;

&lt;ul&gt;

&lt;/ul&gt;</pre>`),

{id:"8-13",n:13,code:"8.D3",title:R("Кибербезопасность: социальная инженерия и защита аккаунтов","Киберкоопсуздук: социалдык инженерия жана аккаунттарды коргоо"),illus:l=>ILL.pwd(l),
 goal:R("Распознавать приёмы социальной инженерии и применять способы защиты аккаунтов и устройств.","Социалдык инженериянын ыкмаларын таанууну жана аккаунттарды, түзмөктөрдү коргоонун жолдорун колдонууну үйрөнүү."),
 theory:R(`<p><b>Социальная инженерия</b> — обман, при котором злоумышленник действует не через взлом программы, а через человека: давит на страх, жалость, любопытство, спешку или выдаёт себя за знакомого.</p>
<p><b>Защита аккаунтов:</b> длинные разные пароли; <b>двухэтапная проверка</b> (код на телефон или в приложении); выход из аккаунта на чужих устройствах; проверка «активных сеансов».</p>
<p><b>Защита устройств:</b> обновления системы и программ закрывают «дыры» безопасности; антивирус; блокировка экрана; осторожность с флешками и файлами от незнакомцев.</p>
<p>В <b>общественном Wi‑Fi</b> без пароля данные могут перехватить — не входите там в важные аккаунты и не вводите данные карт.</p>`,
`<p><b>Социалдык инженерия</b> — кылмышкер программаны бузуу аркылуу эмес, адам аркылуу аракеттенген алдамчылык: коркунучка, боорукердикке, кызыгууга, шашылышка басым жасайт же өзүн тааныш катары көрсөтөт.</p>
<p><b>Аккаунттарды коргоо:</b> узун жана ар түрдүү сырсөздөр; <b>эки баскычтуу текшерүү</b> (телефонго же колдонмого код); бөтөн түзмөктөрдө аккаунттан чыгуу; «активдүү сеанстарды» текшерүү.</p>
<p><b>Түзмөктөрдү коргоо:</b> система жана программалардын жаңыртуулары коопсуздуктун «тешиктерин» жабат; антивирус; экранды бөгөттөө; бейтааныштардан келген флешкалар жана файлдар менен этият болуу.</p>
<p>Сырсөзсүз <b>коомдук Wi‑Fiда</b> маалыматтарды кармап алышы мүмкүн — ал жерде маанилүү аккаунттарга кирбеңиз жана карталардын маалыматтарын киргизбеңиз.</p>`),
 example:R(`Звонок: «Здравствуйте, это служба безопасности банка. С вашей карты пытаются снять деньги, срочно назовите код из SMS!» Приёмы: страх и спешка, выдача себя за сотрудника. Правильно: положить трубку и самому позвонить в банк по номеру с обратной стороны карты.`,
`Чалуу: «Саламатсызбы, бул банктын коопсуздук кызматы. Картаңыздан акча алууга аракет кылып жатышат, SMSтеги кодду тез айтыңыз!» Ыкмалар: коркутуу жана шаштыруу, өзүн кызматкер катары көрсөтүү. Туурасы: телефонду коюп, картанын арт жагындагы номер боюнча банкка өзүңүз чалуу.`),

  [{id:"d",type:"choice",pts:1,q:R("Телефон предлагает обновление системы безопасности. Что делать?","Телефон коопсуздук системасынын жаңыртуусун сунуштайт. Эмне кылуу керек?"),opts:[R("Никогда не обновлять","Эч качан жаңыртпоо"),R("Установить: обновления закрывают уязвимости","Орнотуу: жаңыртуулар аялуу жерлерди жабат")],ans:1},

{id:"9-1",n:1,code:"9.A1",title:R("Кодирование изображений: размер и форматы","Сүрөттөрдү коддоо: көлөмү жана форматтары"),illus:l=>ILL.pixels(l),

 theory:R(`<p><b>Растровое</b> изображение — сетка точек-<b>пикселей</b>. <b>Разрешение</b> — число пикселей по ширине и высоте (1920 × 1080). <b>Глубина цвета</b> i — сколько бит на пиксель; число цветов N = 2<sup>i</sup> (8 бит → 256 цветов, 24 бита → 16,7 млн).</p>
<p><b>Объём</b> без сжатия: V = ширина × высота × i (бит). Делим на 8 — байты, ещё на 1024 — килобайты (КБ).</p>
<p><b>Векторное</b> изображение (SVG) хранит формулы фигур, поэтому не теряет качество при увеличении — удобно для логотипов и схем.</p>
<p><b>Форматы:</b> BMP — без сжатия; PNG — сжатие без потерь, прозрачность (схемы, скриншоты); JPEG — сжатие с потерями (фотографии); при сильном сжатии JPEG появляются «квадратики» — артефакты.</p>`,
`<p><b>Растрдык</b> сүрөт — чекиттердин-<b>пикселдердин</b> тору. <b>Чечилиши</b> — туурасы жана бийиктиги боюнча пикселдердин саны (1920 × 1080). <b>Түстүн тереңдиги</b> i — бир пикселге канча бит; түстөрдүн саны N = 2<sup>i</sup> (8 бит → 256 түс, 24 бит → 16,7 млн).</p>
<p>Кысуусуз <b>көлөмү</b>: V = туурасы × бийиктиги × i (бит). 8ге бөлөбүз — байт, дагы 1024кө — килобайт (КБ).</p>
<p><b>Вектордук</b> сүрөт (SVG) фигуралардын формулаларын сактайт, ошондуктан чоңойтууда сапатын жоготпойт — логотиптер жана схемалар үчүн ыңгайлуу.</p>
<p><b>Форматтар:</b> BMP — кысуусуз; PNG — жоготуусуз кысуу, тунуктук (схемалар, скриншоттор); JPEG — жоготуу менен кысуу (сүрөттөр); JPEGти катуу кыскында «чарчылар» — артефакттар пайда болот.</p>`),
 example:R(`Картинка 100 × 50 пикселей, 256 цветов. 256 = 2⁸ → i = 8 бит = 1 байт. V = 100 · 50 · 1 = 5000 байт ≈ 4,9 КБ.`,`Сүрөт 100 × 50 пиксель, 256 түс. 256 = 2⁸ → i = 8 бит = 1 байт. V = 100 · 50 · 1 = 5000 байт ≈ 4,9 КБ.`),

 theory:R(`<p>Звук — это волна. Чтобы сохранить его в компьютере, громкость измеряют много раз в секунду — это <b>дискретизация</b>. <b>Частота дискретизации</b> f — число измерений в секунду (44 100 Гц у музыки CD-качества).</p>
<p>Каждое измерение записывают числом из i бит — <b>глубина кодирования</b> (16 бит = 65 536 уровней громкости). Стерео — 2 канала (k = 2).</p>
<p><b>Объём</b>: V = f × i × k × t (бит), где t — время в секундах.</p>
<p>Чем выше частота и глубина, тем точнее звук и больше файл. Формат <b>MP3</b> сжимает звук с потерями, удаляя то, что ухо почти не слышит, — файл меньше примерно в 10 раз.</p>`,
`<p>Үн — толкун. Аны компьютерде сактоо үчүн катуулукту секундасына көп жолу ченешет — бул <b>дискреттөө</b>. <b>Дискреттөө жыштыгы</b> f — секундадагы ченөөлөрдүн саны (CD сапатындагы музыкада 44 100 Гц).</p>
<p>Ар бир ченөөнү i биттен турган сан менен жазышат — <b>коддоо тереңдиги</b> (16 бит = катуулуктун 65 536 деңгээли). Стерео — 2 канал (k = 2).</p>
<p><b>Көлөмү</b>: V = f × i × k × t (бит), мында t — секунда менен убакыт.</p>
<p>Жыштык жана тереңдик канчалык жогору болсо, үн ошончолук так жана файл чоң. <b>MP3</b> форматы кулак дээрлик укпаганды алып салып, үндү жоготуу менен кысат — файл болжол менен 10 эсе кичине.</p>`),

{id:"9-3",n:3,code:"9.A2",title:R("Шифры: Цезарь, Виженер, частотный анализ","Шифрлер: Цезарь, Виженер, жыштык талдоо"),illus:l=>ILL.caesar(l),
 goal:R("Понять принципы шифрования, научиться шифровать и расшифровывать сообщения и понимать, почему простые шифры ненадёжны.","Шифрлөөнүн принциптерин түшүнүү, билдирүүлөрдү шифрлөөнү жана чечмелөөнү үйрөнүү, жөнөкөй шифрлер эмне үчүн ишенимсиз экенин түшүнүү."),
 theory:R(`<p><b>Шифрование</b> превращает открытый текст в непонятный без <b>ключа</b>. Расшифровка — обратное действие.</p>
<p><b>Шифр Цезаря:</b> каждая буква сдвигается на k позиций по алфавиту. При k = 3: A→D, B→E, …, X→A (по кругу). Ключ — число k.</p>
<p><b>Шифр Виженера:</b> ключ — слово; каждая буква текста сдвигается на номер соответствующей буквы ключа (A=0, B=1, …). Одна и та же буква шифруется по-разному.</p>
<p><b>Частотный анализ:</b> в любом языке одни буквы встречаются чаще (в английском — E, в русском — О). Самую частую букву шифровки сопоставляют с самой частой буквой языка и находят сдвиг. Поэтому Цезарь взламывается за минуты. Современные шифры (AES) используют длинные ключи и сложную математику.</p>`,
`<p><b>Шифрлөө</b> ачык текстти <b>ачкычсыз</b> түшүнүксүз кылат. Чечмелөө — тескери аракет.</p>
<p><b>Цезарь шифри:</b> ар бир тамга алфавит боюнча k орунга жылат. k = 3 болгондо: A→D, B→E, …, X→A (тегерек боюнча). Ачкыч — k саны.</p>
<p><b>Виженер шифри:</b> ачкыч — сөз; тексттин ар бир тамгасы ачкычтын тиешелүү тамгасынын номерине жылат (A=0, B=1, …). Бир эле тамга ар кандай шифрленет.</p>
<p><b>Жыштык талдоо:</b> ар бир тилде кээ бир тамгалар көбүрөөк кездешет (англис тилинде — E, орус тилинде — О). Шифрдеги эң көп тамганы тилдеги эң көп тамга менен салыштырып, жылышты табышат. Ошондуктан Цезарь бир нече мүнөттө бузулат. Заманбап шифрлер (AES) узун ачкычтарды жана татаал математиканы колдонот.</p>`),
 example:R(`Цезарь, k = 3: CAT → C+3 = F, A+3 = D, T+3 = W → <b>FDW</b>. Расшифровка: сдвиг назад на 3. В Python: <code>chr((ord(c) - 65 + k) % 26 + 65)</code>.`,`Цезарь, k = 3: CAT → C+3 = F, A+3 = D, T+3 = W → <b>FDW</b>. Чечмелөө: 3кө артка жылдыруу. Pythonдо: <code>chr((ord(c) - 65 + k) % 26 + 65)</code>.`),

   {id:"g",type:"text",q:R("Придумайте свой шифр, опишите правило и зашифруйте им своё имя. Как его можно взломать?","Өз шифриңизди ойлоп табыңыз, эрежесин сүрөттөп, атыңызды аны менен шифрлеңиз. Аны кантип бузууга болот?")}]

{id:"9-4",n:4,code:"9.A2",title:R("Хэш, контрольная сумма и электронная подпись","Хэш, текшерүү суммасы жана электрондук кол тамга"),illus:l=>ILL.flow(l,[R("Документ","Документ"),R("Хэш|«отпечаток»","Хэш|«из»"),R("Подпись|закрытый ключ","Кол тамга|жабык ачкыч"),R("Проверка|открытый ключ","Текшерүү|ачык ачкыч")],"#5b5bd6"),
 goal:R("Понять, как хэш и электронная подпись защищают данные от подделки, и применить простую контрольную сумму.","Хэш жана электрондук кол тамга маалыматтарды жасалмалоодон кантип коргорун түшүнүү жана жөнөкөй текшерүү суммасын колдонуу."),
 theory:R(`<p><b>Хэш</b> — короткий «отпечаток» данных фиксированной длины, вычисленный по специальному правилу (например, SHA-256). Даже изменение одной буквы полностью меняет хэш, а восстановить данные по хэшу нельзя. Хэши используют для проверки целостности файлов и для хранения паролей.</p>
<p><b>Контрольная сумма</b> — простейший вариант: например, сумма цифр по модулю 10. Её используют в номерах карт и штрихкодах, чтобы ловить ошибки ввода.</p>
<p><b>Электронная подпись</b> использует пару ключей: <b>закрытым</b> ключом (его знает только владелец) подписывают хэш документа, <b>открытым</b> ключом любой может проверить, что документ подписан именно владельцем и не изменён. В Кыргызстане электронная подпись применяется в государственных услугах и документообороте.</p>`,
`<p><b>Хэш</b> — атайын эреже (мисалы, SHA-256) боюнча эсептелген, маалыматтардын белгиленген узундуктагы кыска «изи». Бир тамганы өзгөртүү да хэшти толугу менен өзгөртөт, ал эми хэш боюнча маалыматтарды калыбына келтирүүгө болбойт. Хэштерди файлдардын бүтүндүгүн текшерүү жана сырсөздөрдү сактоо үчүн колдонушат.</p>
<p><b>Текшерүү суммасы</b> — эң жөнөкөй вариант: мисалы, цифралардын суммасынын 10го бөлгөндөгү калдыгы. Аны киргизүү каталарын кармоо үчүн карталардын номерлеринде жана штрихкоддордо колдонушат.</p>
<p><b>Электрондук кол тамга</b> ачкычтардын жубун колдонот: <b>жабык</b> ачкыч менен (аны ээси гана билет) документтин хэшине кол коюшат, <b>ачык</b> ачкыч менен каалаган адам документке так ээси кол койгонун жана ал өзгөрбөгөнүн текшере алат. Кыргызстанда электрондук кол тамга мамлекеттик кызматтарда жана документ жүгүртүүдө колдонулат.</p>`),
 example:R(`Контрольная цифра для номера 4721: 4 + 7 + 2 + 1 = 14, 14 % 10 = <b>4</b>. Номер записывают как 4721-4. Если при вводе ошибиться в одной цифре (4731-4), сумма станет 15 → 5 ≠ 4, и ошибка обнаружится.`,`4721 номери үчүн текшерүү цифрасы: 4 + 7 + 2 + 1 = 14, 14 % 10 = <b>4</b>. Номерди 4721-4 деп жазышат. Киргизүүдө бир цифрада жаңылышса (4731-4), сумма 15 → 5 ≠ 4 болуп, ката табылат.`),

{id:"9-5",n:5,code:"9.A3",title:R("Математическая модель: вклад, кредит, прогноз","Математикалык модель: салым, насыя, болжол"),illus:l=>ILL.flow(l,[R("Задача","Маселе"),R("Формула|S·(1 + r)","Формула|S·(1 + r)"),R("Таблица|по годам","Таблица|жылдар боюнча"),R("Прогноз","Болжол")],"#5b5bd6"),

 goal:R("Формализовать финансовую задачу в виде модели, рассчитать её в таблице и использовать для прогноза и выбора решения.","Каржылык маселени модель түрүндө формалдаштыруу, аны таблицада эсептөө жана болжолдоо, чечим тандоо үчүн колдонуу."),
 theory:R(`<p><b>Математическая модель</b> описывает процесс формулами. Для вклада со <b>сложными процентами</b> каждый год сумма умножается на (1 + r), где r — ставка: S<sub>следующий</sub> = S · (1 + r). Через n лет: S · (1 + r)<sup>n</sup>.</p>
<p>При <b>простых процентах</b> проценты начисляются только на начальную сумму: S + S · r · n.</p>
<p>У <b>кредитов</b> и микрозаймов важна полная переплата, а не только «маленький процент в месяц»: 3 % в месяц — это 36 % в год.</p>
<p>Модель помогает сравнить варианты, но реальные условия (комиссии, инфляция, досрочное погашение) нужно уточнять в договоре. Ставки в задачах условные.</p>`,
`<p><b>Математикалык модель</b> процессти формулалар менен сүрөттөйт. <b>Татаал пайыздар</b> менен салым үчүн ар жылы сумма (1 + r)ге көбөйтүлөт, мында r — чен: S<sub>кийинки</sub> = S · (1 + r). n жылдан кийин: S · (1 + r)<sup>n</sup>.</p>
<p><b>Жөнөкөй пайыздарда</b> пайыздар баштапкы суммага гана эсептелет: S + S · r · n.</p>
<p><b>Насыяларда</b> жана микронасыяларда «айына кичинекей пайыз» гана эмес, толук ашыкча төлөм маанилүү: айына 3 % — жылына 36 %.</p>
<p>Модель варианттарды салыштырууга жардам берет, бирок чыныгы шарттарды (комиссиялар, инфляция, мөөнөтүнөн мурда төлөө) келишимден тактоо керек. Маселелердеги чендер шарттуу.</p>`),

{id:"9-6",n:6,code:"9.B1",title:R("Установка и настройка ОС и программ","ОС жана программаларды орнотуу жана жөндөө"),illus:l=>ILL.flow(l,[R("Резервная|копия","Резервдик|көчүрмө"),R("Установка|ОС","ОСти|орнотуу"),R("Драйверы","Драйверлер"),R("Обновления","Жаңыртуулар"),R("Учётные|записи","Эсептик|жазуулар")],"#0c8599"),
 goal:R("Узнать, как устанавливают и настраивают операционную систему и программы, и проверить работоспособность компьютера.","Операциялык система жана программалар кантип орнотулуп, жөндөлөрүн билүү жана компьютердин иштөө жөндөмүн текшерүү."),
 theory:R(`<p>Перед установкой ОС делают <b>резервную копию</b> важных файлов. Затем устанавливают систему с загрузочной флешки, ставят <b>драйверы</b> — программы, которые «объясняют» ОС, как работать с конкретным устройством (видеокарта, принтер, Wi‑Fi).</p>
<p>После установки: включают <b>обновления</b>, антивирус, создают <b>учётные записи</b>: администратор (может устанавливать программы) и обычный пользователь (для повседневной работы — безопаснее).</p>
<p><b>Диспетчер задач</b> (Windows) или «Системный монитор» (Linux) показывает загрузку процессора, памяти и диска — по нему ищут причину «тормозов».</p>
<p>Программы устанавливают из официальных источников, ненужные — удаляют, автозагрузку лишних программ отключают.</p>`,
`<p>ОС орнотуудан мурун маанилүү файлдардын <b>резервдик көчүрмөсүн</b> жасашат. Андан кийин системаны жүктөөчү флешкадан орнотуп, <b>драйверлерди</b> коюшат — ОСке белгилүү бир түзмөк (видеокарта, принтер, Wi‑Fi) менен кантип иштөөнү «түшүндүргөн» программалар.</p>
<p>Орнотуудан кийин: <b>жаңыртууларды</b>, антивирусту күйгүзүшөт, <b>эсептик жазууларды</b> түзүшөт: администратор (программаларды орното алат) жана жөнөкөй колдонуучу (күнүмдүк иш үчүн — коопсузураак).</p>
<p><b>Тапшырмалар диспетчери</b> (Windows) же «Системалык монитор» (Linux) процессордун, эс тутумдун жана дисктин жүктөлүшүн көрсөтөт — ал аркылуу «тормоздун» себебин издешет.</p>
<p>Программаларды расмий булактардан орнотушат, керексиздерин өчүрүшөт, ашыкча программалардын автожүктөлүшүн өчүрүшөт.</p>`),
 example:R(`После установки Linux в классе не работает Wi‑Fi. Причина — нет драйвера для сетевого адаптера. Решение: подключить кабель, обновить систему и установить драйвер из официального репозитория.`,`Класста Linux орнотулгандан кийин Wi‑Fi иштебейт. Себеби — тармак адаптери үчүн драйвер жок. Чечим: кабелди туташтырып, системаны жаңыртып, драйверди расмий репозиторийден орнотуу.`),

 goal:R("Понять назначение сетевых устройств и протоколов, научиться определять адреса в одной сети и настраивать права доступа.","Тармак түзмөктөрүнүн жана протоколдорунун милдетин түшүнүү, бир тармактагы даректерди аныктоону жана кирүү укуктарын жөндөөнү үйрөнүү."),
 theory:R(`<p>В локальной сети компьютеры подключены к <b>коммутатору</b>, а <b>роутер</b> (шлюз) соединяет сеть с интернетом. Адреса устройствам обычно выдаёт служба <b>DHCP</b>.</p>
<p>Запись <b>192.168.5.0/24</b> означает: первые три числа — адрес сети, последнее — номер устройства. Устройства с одинаковыми первыми тремя числами находятся в одной сети и «видят» друг друга напрямую. Номера 0 и 255 зарезервированы, поэтому устройств может быть 254.</p>
<p><b>Протоколы</b> — правила обмена: TCP/IP (доставка данных), HTTP/HTTPS (сайты), DHCP (выдача адресов), DNS (имена). Команда <code>ping</code> проверяет, отвечает ли устройство.</p>
<p><b>Права доступа</b> к общим папкам: «только чтение» или «чтение и запись». Wi‑Fi защищают паролем и шифрованием WPA2/WPA3.</p>`,
`<p>Жергиликтүү тармакта компьютерлер <b>коммутаторго</b> туташат, ал эми <b>роутер</b> (шлюз) тармакты интернет менен байланыштырат. Түзмөктөргө даректерди адатта <b>DHCP</b> кызматы берет.</p>
<p><b>192.168.5.0/24</b> жазуусу мындайды билдирет: алгачкы үч сан — тармактын дареги, акыркысы — түзмөктүн номери. Алгачкы үч саны бирдей түзмөктөр бир тармакта болушат жана бири-бирин түз «көрүшөт». 0 жана 255 номерлери ээленген, ошондуктан түзмөктөр 254 болушу мүмкүн.</p>
<p><b>Протоколдор</b> — алмашуу эрежелери: TCP/IP (маалыматтарды жеткирүү), HTTP/HTTPS (сайттар), DHCP (даректерди берүү), DNS (аттар). <code>ping</code> буйругу түзмөк жооп берерин текшерет.</p>
<p>Жалпы папкаларга <b>кирүү укуктары</b>: «окуу гана» же «окуу жана жазуу». Wi‑Fiды сырсөз жана WPA2/WPA3 шифрлөөсү менен коргошот.</p>`),
 example:R(`Учительский компьютер 192.168.5.10/24 и ученический 192.168.5.37/24 — в одной сети (192.168.5). Принтер 192.168.6.20 — в другой сети, и без роутера к нему не подключиться.`,`Мугалимдин компьютери 192.168.5.10/24 жана окуучунуку 192.168.5.37/24 — бир тармакта (192.168.5). 192.168.6.20 принтери — башка тармакта, ага роутерсиз туташууга болбойт.`),

{id:"9-8",n:8,code:"9.B3",title:R("Роботы и датчики: программирование робота","Роботтор жана датчиктер: роботту программалоо"),illus:l=>ILL.flow(l,[R("Датчики|видят мир","Датчиктер|дүйнөнү көрөт"),R("Контроллер|программа","Контроллер|программа"),R("Моторы|действуют","Моторлор|аракеттенет")],"#0c8599"),
 goal:R("Понять устройство робота, научиться программировать его движение с повторами и датчиками и улучшать программу.","Роботтун түзүлүшүн түшүнүү, анын кыймылын кайталоолор жана датчиктер менен программалоону жана программаны жакшыртууну үйрөнүү."),
 theory:R(`<p><b>Робот</b> состоит из датчиков (сенсоров), контроллера и исполнительных устройств (моторов). <b>Датчики</b> измеряют мир: ультразвуковой — расстояние до препятствия, датчик освещённости, касания, температуры. <b>Контроллер</b> выполняет программу и решает, что делать. <b>Моторы</b> двигают робота.</p>
<p>В нашем симуляторе робот понимает команды: <code>вперёд N</code>, <code>налево</code>, <code>направо</code>, <code>повтори N [ … ]</code> и команду с датчиком <code>пока_свободно [ … ]</code> — повторять, пока впереди нет стены.</p>
<p>Программа без датчиков работает только на одном поле. Программа с датчиками <b>универсальна</b>: робот сам «видит» стену и подстраивается. Так работают роботы-пылесосы и автопилоты.</p>
<p><b>Эффективность</b> программы — число шагов и длина кода: повторы делают код короче.</p>`,
`<p><b>Робот</b> датчиктерден (сенсорлордон), контроллерден жана аткаруучу түзмөктөрдөн (моторлордон) турат. <b>Датчиктер</b> дүйнөнү ченешет: ультраүн — тоскоолдукка чейинки аралыкты, жарыктык, тийүү, температура датчиктери. <b>Контроллер</b> программаны аткарып, эмне кылууну чечет. <b>Моторлор</b> роботту кыймылдатат.</p>
<p>Биздин симулятордо робот буйруктарды түшүнөт: <code>алга N</code>, <code>солго</code>, <code>оңго</code>, <code>кайтала N [ … ]</code> жана датчик менен буйрук <code>бош_болсо [ … ]</code> — алдыда дубал жок болгончо кайталоо.</p>
<p>Датчиксиз программа бир гана талаада иштейт. Датчиктүү программа <b>универсалдуу</b>: робот дубалды өзү «көрүп», ыңгайлашат. Робот-чаң соргучтар жана автопилоттор ушундай иштешет.</p>
<p>Программанын <b>натыйжалуулугу</b> — кадамдардын саны жана коддун узундугу: кайталоолор кодду кыскартат.</p>`),
 example:R(`Квадрат: <code>повтори 4 [ вперёд 2 направо ]</code> — 8 шагов, а код в 4 раза короче, чем без повтора.`,`Чарчы: <code>кайтала 4 [ алга 2 оңго ]</code> — 8 кадам, ал эми код кайталоосузга караганда 4 эсе кыска.`),

 ]},
{id:"9-9",n:9,code:"9.C1",title:R("Структуры данных и рекурсия","Маалымат түзүмдөрү жана рекурсия"),illus:l=>ILL.nest(l),
 goal:R("Познакомиться со словарями и стеком и научиться писать рекурсивные функции.","Сөздүктөр жана стек менен таанышуу жана рекурсивдүү функцияларды жазууну үйрөнүү."),
 theory:R(`<p><b>Структура данных</b> — способ хранить и организовывать данные. <b>Список</b> — упорядоченный набор. <b>Словарь</b> хранит пары «ключ: значение»: <code>pop = {"Ош": 3, "Нарын": 1}</code>, <code>pop["Ош"]</code> → 3. <b>Стек</b> работает по правилу «последним пришёл — первым ушёл»: <code>s.append(x)</code> кладёт, <code>s.pop()</code> снимает верхний.</p>
<p><b>Рекурсия</b> — функция вызывает саму себя для более простой задачи. Обязательна <b>базовый случай</b>, когда рекурсия останавливается, иначе программа зациклится.</p>
<pre class="out">def fact(n):
    if n == 0:          # базовый случай
        return 1
    return n * fact(n - 1)</pre>`,
`<p><b>Маалымат түзүмү</b> — маалыматтарды сактоо жана уюштуруу ыкмасы. <b>Тизме</b> — ирээттелген топтом. <b>Сөздүк</b> «ачкыч: маани» жуптарын сактайт: <code>pop = {"Ош": 3, "Нарын": 1}</code>, <code>pop["Ош"]</code> → 3. <b>Стек</b> «акыркы келген — биринчи кетет» эрежеси боюнча иштейт: <code>s.append(x)</code> коёт, <code>s.pop()</code> үстүңкүсүн алат.</p>
<p><b>Рекурсия</b> — функция өзүн жөнөкөйрөөк маселе үчүн чакырат. Рекурсия токтогон <b>базалык учур</b> милдеттүү, болбосо программа циклге кирип калат.</p>
<pre class="out">def fact(n):
    if n == 0:          # базалык учур
        return 1
    return n * fact(n - 1)</pre>`),
 example:R(`fact(3) = 3 · fact(2) = 3 · 2 · fact(1) = 3 · 2 · 1 · fact(0) = 3 · 2 · 1 · 1 = 6. Каждый вызов ждёт результата следующего — вызовы складываются в стек.`,`fact(3) = 3 · fact(2) = 3 · 2 · fact(1) = 3 · 2 · 1 · fact(0) = 3 · 2 · 1 · 1 = 6. Ар бир чакыруу кийинкисинин жыйынтыгын күтөт — чакыруулар стекке топтолот.`),

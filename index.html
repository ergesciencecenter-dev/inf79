{id:"9-10",n:10,code:"9.C1",title:R("Сортировка и поиск: сравнение алгоритмов","Иреттөө жана издөө: алгоритмдерди салыштыруу"),illus:l=>ILL.sortbars(l),
 goal:R("Изучить алгоритмы сортировки и поиска и научиться оценивать их эффективность.","Иреттөө жана издөө алгоритмдерин үйрөнүү жана алардын натыйжалуулугун баалоону үйрөнүү."),
 theory:R(`<p><b>Линейный поиск</b> проверяет элементы по очереди: в худшем случае — n сравнений. <b>Бинарный поиск</b> работает только в отсортированном списке: сравниваем с серединой и отбрасываем половину. Для 1000 элементов — не больше 10 шагов (2¹⁰ = 1024).</p>
<p><b>Сортировка пузырьком:</b> проходим по списку, сравниваем соседей и меняем местами, если порядок неверный; за проход самый большой элемент «всплывает» в конец. Нужно до n − 1 проходов — для больших списков медленно.</p>
<p>В Python есть быстрая встроенная сортировка <code>sorted(a)</code>, но понимать, как устроены алгоритмы, нужно, чтобы выбирать подходящий и оценивать время работы.</p>`,
`<p><b>Сызыктуу издөө</b> элементтерди кезек менен текшерет: эң начар учурда — n салыштыруу. <b>Бинардык издөө</b> иреттелген тизмеде гана иштейт: ортосу менен салыштырып, жарымын таштайбыз. 1000 элемент үчүн — 10 кадамдан ашпайт (2¹⁰ = 1024).</p>
<p><b>Көбүкчө иреттөө:</b> тизме боюнча өтүп, кошуналарды салыштырабыз жана тартиби туура эмес болсо, ордун алмаштырабыз; бир өтүүдө эң чоң элемент аягына «калкып чыгат». n − 1 өтүүгө чейин керек — чоң тизмелер үчүн жай.</p>
<p>Pythonдо ылдам орнотулган <code>sorted(a)</code> иреттөөсү бар, бирок ылайыктуусун тандоо жана иштөө убактысын баалоо үчүн алгоритмдер кантип түзүлгөнүн түшүнүү керек.</p>`),
 example:R(`Ищем 37 в [3, 8, 15, 22, 37, 41, 50]: середина 22 → 37 больше, берём правую половину [37, 41, 50]; середина 41 → меньше, берём [37] → нашли за 3 шага. Линейному поиску понадобилось бы 5.`,`[3, 8, 15, 22, 37, 41, 50] ичинен 37ни издейбиз: ортосу 22 → 37 чоң, оң жарымын алабыз [37, 41, 50]; ортосу 41 → кичине, [37] алабыз → 3 кадамда таптык. Сызыктуу издөөгө 5 кадам керек болмок.`),
 levels:[

   {id:"f",type:"choice",pts:1,q:R("Когда бинарный поиск НЕЛЬЗЯ применять?","Бинардык издөөнү качан колдонууга БОЛБОЙТ?"),opts:[R("Если список не отсортирован","Тизме иреттелбеген болсо"),R("Если в списке больше 100 элементов","Тизмеде 100дөн көп элемент болсо")],ans:0},

{id:"9-11",n:11,code:"9.C1",title:R("Обработка данных: оценки класса","Маалыматтарды иштетүү: класстын баалары"),illus:l=>`<pre class="out">5

 theory:R(`<p>Данные часто хранят в формате <b>CSV</b>: каждая строка — запись, поля разделены точкой с запятой или запятой: <code>Айбек;5</code>.</p>
<p>Строку разбивают методом <code>split</code>: <code>name, mark = line.split(";")</code>, затем число преобразуют: <code>int(mark)</code>.</p>
<p>Типовые задачи обработки: сумма и среднее, максимум и кто его получил, количество записей по условию, фильтрация.</p>
<p><code>round(x, 2)</code> округляет до двух знаков.</p>`,
`<p>Маалыматтарды көбүнчө <b>CSV</b> форматында сакташат: ар бир сап — жазуу, талаалар үтүрлүү чекит же үтүр менен бөлүнөт: <code>Айбек;5</code>.</p>
<p>Сапты <code>split</code> методу менен бөлүшөт: <code>name, mark = line.split(";")</code>, андан кийин санга айландырышат: <code>int(mark)</code>.</p>
<p>Иштетүүнүн типтүү маселелери: сумма жана орточо, максимум жана аны ким алганы, шарт боюнча жазуулардын саны, чыпкалоо.</p>
<p><code>round(x, 2)</code> эки белгиге чейин тегеректейт.</p>`),
 example:R(`<pre class="out">n = int(input())
s = 0
for i in range(n):
    name, mark = input().split(";")
    s += int(mark)
print(round(s / n, 2))</pre>`,`<pre class="out">n = int(input())
s = 0
for i in range(n):
    name, mark = input().split(";")
    s += int(mark)
print(round(s / n, 2))</pre>`),

{id:"9-12",n:12,code:"9.D1",title:R("Веб-страница: структура, стили и доступность","Веб-барак: түзүлүш, стилдер жана жеткиликтүүлүк"),illus:l=>ILL.layout(l),
 goal:R("Создать функциональную стилизованную страницу с семантической разметкой и оценить её доступность.","Семантикалык белгилөөсү бар функционалдуу, стилдештирилген баракты түзүү жана анын жеткиликтүүлүгүн баалоо."),
 theory:R(`<p><b>Семантические теги</b> описывают смысл частей страницы: <code>&lt;header&gt;</code> — шапка, <code>&lt;nav&gt;</code> — меню, <code>&lt;main&gt;</code> — основное содержание, <code>&lt;footer&gt;</code> — подвал. Их понимают поисковики и программы чтения с экрана.</p>
<p><b>Доступность</b>: атрибут <code>lang</code> у <code>&lt;html&gt;</code> (язык страницы для озвучивания), <code>alt</code> у всех картинок, один главный заголовок <code>h1</code>, достаточный контраст текста и фона, крупный шрифт.</p>
<p><b>CSS</b>: классы (<code>.card</code>), шрифт (<code>font-family</code>), размеры (<code>font-size</code>), раскладка <code>display: flex</code> — элементы в ряд.</p>
<p>Качество сайта проверяют по стандартам (валидатор HTML), совместимости с разными браузерами и устройствами (телефон!) и доступности.</p>`,
`<p><b>Семантикалык тегдер</b> барактын бөлүктөрүнүн маанисин сүрөттөйт: <code>&lt;header&gt;</code> — баш бөлүк, <code>&lt;nav&gt;</code> — меню, <code>&lt;main&gt;</code> — негизги мазмун, <code>&lt;footer&gt;</code> — аяк бөлүк. Аларды издөө системалары жана экрандан окуу программалары түшүнүшөт.</p>
<p><b>Жеткиликтүүлүк</b>: <code>&lt;html&gt;</code> тегиндеги <code>lang</code> атрибуту (үн менен окуу үчүн барактын тили), бардык сүрөттөрдө <code>alt</code>, бир башкы <code>h1</code> аталышы, текст менен фондун жетиштүү контрасты, ири шрифт.</p>
<p><b>CSS</b>: класстар (<code>.card</code>), шрифт (<code>font-family</code>), өлчөмдөр (<code>font-size</code>), <code>display: flex</code> жайгаштыруусу — элементтер катар.</p>
<p>Сайттын сапатын стандарттар (HTML валидатору), ар кандай браузерлер жана түзмөктөр (телефон!) менен шайкештик жана жеткиликтүүлүк боюнча текшеришет.</p>`),
 example:R(`<pre class="out">&lt;html lang="ru"&gt;
&lt;body&gt;
  &lt;header&gt;&lt;h1&gt;Школа №30&lt;/h1&gt;&lt;/header&gt;
  &lt;nav&gt;&lt;a href="#news"&gt;Новости&lt;/a&gt;&lt;/nav&gt;
  &lt;main&gt;…&lt;/main&gt;
  &lt;footer&gt;© 2026&lt;/footer&gt;
&lt;/body&gt;</pre>`,`<pre class="out">&lt;html lang="ky"&gt;
&lt;body&gt;
  &lt;header&gt;&lt;h1&gt;№30 мектеп&lt;/h1&gt;&lt;/header&gt;
  &lt;nav&gt;&lt;a href="#news"&gt;Жаңылыктар&lt;/a&gt;&lt;/nav&gt;
  &lt;main&gt;…&lt;/main&gt;
  &lt;footer&gt;© 2026&lt;/footer&gt;
&lt;/body&gt;</pre>`),

<p>Программы: Tinkercad (онлайн, просто), Blender (свободная, профессиональная). Модели печатают на 3D-принтере.</p>`,
`<p><b>Пикселдик (растрдык)</b> графика — чекиттердин тору, <b>вектордук</b> — фигуралар жана формулалар. <b>3D-графика</b> объекттерди мейкиндикте (x, y, z) сүрөттөйт.</p>
<p>3D-модель <b>чокулардан</b> (чекиттерден), <b>кабыргалардан</b> (кесиндилерден) жана <b>грандардан</b> (көп бурчтуктардан, «полигондордон») турат. Полигондор канчалык көп болсо, модель ошончолук жылмакай, бирок аны иштетүү ошончолук оор — оюндарда моделдерди <b>оптималдаштырышат</b>.</p>
<p><b>Текстура</b> — бетке «тартылган» сүрөт (жыгач, таш). <b>Рендеринг</b> — жарык жана көлөкөлөр менен акыркы сүрөттү эсептөө.</p>
<p>Программалар: Tinkercad (онлайн, жөнөкөй), Blender (эркин, кесипкөй). Моделдерди 3D-принтерде басып чыгарышат.</p>`),

 theory:R(`<p><b>Авторское право</b> возникает у автора автоматически, как только произведение создано (текст, фото, музыка, программа). В Кыргызстане его регулирует Закон «Об авторском праве и смежных правах»; персональные данные защищает Закон «Об информации персонального характера».</p>
<p><b>Плагиат</b> — выдача чужого произведения или его части за своё. Цитировать можно, если указан автор и источник, а цитата не заменяет собственную работу.</p>
<p><b>Creative Commons (CC)</b> — лицензии, которыми автор заранее разрешает использование: <b>BY</b> — укажи автора, <b>NC</b> — не для коммерции, <b>ND</b> — без изменений, <b>SA</b> — распространяй на тех же условиях.</p>
<p>Публикация чужих фото, переписки, персональных данных без согласия может нарушать закон и права человека.</p>`,
`<p><b>Автордук укук</b> чыгарма (текст, сүрөт, музыка, программа) түзүлөрү менен эле авторго автоматтык түрдө пайда болот. Кыргызстанда аны «Автордук укук жана чектеш укуктар жөнүндө» Мыйзам жөнгө салат; жеке маалыматтарды «Жеке мүнөздөгү маалымат жөнүндө» Мыйзам коргойт.</p>
<p><b>Плагиат</b> — башканын чыгармасын же анын бөлүгүн өзүңүздүкү катары берүү. Автору жана булагы көрсөтүлсө, ал эми цитата өз ишиңиздин ордун баспаса, цитата келтирүүгө болот.</p>
<p><b>Creative Commons (CC)</b> — автор колдонууга алдын ала уруксат берген лицензиялар: <b>BY</b> — авторду көрсөт, <b>NC</b> — коммерция үчүн эмес, <b>ND</b> — өзгөртүүсүз, <b>SA</b> — ошол эле шарттарда тарат.</p>
<p>Башкалардын сүрөттөрүн, жазышууларын, жеке маалыматтарын макулдугусуз жарыялоо мыйзамды жана адамдын укуктарын бузушу мүмкүн.</p>`),

async function rpc(fn,args,ctx){let r;try{r=await fetch(DB_CONFIG.url.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:Object.assign({"Content-Type":"application/json",apikey:DB_CONFIG.key},DB_CONFIG.key.startsWith("eyJ")?{Authorization:"Bearer "+DB_CONFIG.key}:{}),body:JSON.stringify(args)})}catch(e){throw t_("netErr")}
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok){const m=String((j&&j.message)||txt||r.status);if(m==="NEED_CODE")throw "NEED_CODE";if(m==="EXISTS")throw t_(ctx==="t"?"tExists":"exists");if(m==="NOTFOUND"&&ctx==="t")throw t_("tNotFound");

const LOOK={"А":"A","В":"B","С":"C","Е":"E","а":"A","в":"B","с":"C","е":"E"};

    function num(v){if(typeof v!=="number")throw "#ЗНАЧ!";return v}
    function range(a,b){a=normRef(a).replace(/\$/g,"");b=normRef(b).replace(/\$/g,"");const c1=COLS.indexOf(a[0]),c2=COLS.indexOf(b[0]),r1=+a.slice(1),r2=+b.slice(1);const out=[];
      for(let c=Math.min(c1,c2);c<=Math.max(c1,c2);c++)for(let r=Math.min(r1,r2);r<=Math.max(r1,r2);r++)out.push(cellVal(COLS[c]+r,depth));return out}
    function expr(){let v=term();while(peek()==="+"||peek()==="-"){const o=next();const b=term();v=o==="+"?num(v)+num(b):num(v)-num(b)}return v}
    function term(){let v=factor();while(peek()==="*"||peek()==="/"){const o=next();const b=factor();if(o==="*")v=num(v)*num(b);else{if(num(b)===0)throw "#ДЕЛ/0!";v=num(v)/b}}return v}
    function factor(){const x=next();if(x==null)throw "#ОШИБКА";
      if(x==="-")return -num(factor());if(x==="+")return num(factor());
      if(x==="("){const v=expr();if(next()!==")")throw "#ОШИБКА";return v}
      if(/^\d/.test(x))return Number(x.replace(",","."));
      if(isRef(x))return cellVal(x,depth);
      const fn=x.toUpperCase();if(next()!=="(")throw "#ИМЯ?";const args=[];
      if(peek()!==")"){do{if(isRef(peek())&&toks[k+1]===":"){const a=next();next();const b=next();args.push(...range(a,b))}else args.push(expr())}while((peek()===";"||peek()===",")&&next())}
      if(next()!==")")throw "#ОШИБКА";const nums=args.filter(a=>typeof a==="number");

    const v=expr();if(k<toks.length)throw "#ОШИБКА";return v}
  const vals={};for(const a in cells){try{vals[a]=cellVal(a,0)}catch(e){vals[a]=typeof e==="string"?e:"#ОШИБКА"}}return vals}

let pyW=null,pyReady=null,pySeq=0;const pyCb={};
function pyWorker(){if(pyW&&pyReady)return pyReady;
  const src=`importScripts(${JSON.stringify(PYODIDE_URL)});const P=loadPyodide();P.then(()=>postMessage({ready:1}),e=>postMessage({fail:String(e)}));
onmessage=async e=>{const d=e.data;try{const py=await P;py.globals.set("USER_CODE",d.code);py.globals.set("INPUT",d.input);const out=py.runPython(${JSON.stringify(PY_WRAP)});postMessage({id:d.id,out:String(out)})}catch(err){postMessage({id:d.id,out:String(err)})}};`;
  try{pyW=new Worker(URL.createObjectURL(new Blob([src],{type:"text/javascript"})))}catch(e){pyW=null;return Promise.reject(e)}

  if(i.type==="str")return{frac:i.ans.some(x=>toks(x).toLowerCase()===toks(a).toLowerCase())?1:0};
  if(i.type==="num"){const v=Number(String(a??"").replace(",",".").replace(/\s/g,""));return{frac:String(a??"").trim()!==""&&Math.abs(v-i.ans)<=i.tol?1:0}}
  if(i.type==="sheet"){const cells=sheetCells(w,i.sheet,r);const vals=evalSheet(cells);let got=0,tot=0;const marks={};
    for(const c of i.checks){tot+=c.pts;const raw=cells[c.cell].raw.trim();const good=(!c.f||raw.startsWith("="))&&typeof vals[c.cell]==="number"&&Math.abs(vals[c.cell]-c.v)<=(c.tol||1e-6);marks[c.cell]=good;if(good)got+=c.pts}
    return{frac:got/tot,marks}}
  return{frac:0}}

   <div class="row" style="margin-top:6px"><button class="ghost" data-run>▶ ${t_("run")}</button><span class="small mute">${t_("stdin")}:</span><textarea data-stdin class="code" style="min-height:44px;width:150px">${esc(i.tests[0].in)}</textarea></div><pre class="out" data-out hidden></pre>`;
  if(i.type==="num")body=`<input class="numin" inputmode="decimal" value="${esc(a??"")}" ${dis} style="width:160px">`;

function sheetHTML(w,sid,r){const def=w.sheets[sid];const cells=sheetCells(w,sid,r);const vals=evalSheet(cells);

  for(let i=1;i<=def.rows;i++){h+=`<tr><th>${i}</th>`;for(let j=0;j<def.cols;j++){const a=COLS[j]+i;const c=cells[a];const v=vals[a];
    h+=`<td class="${c.lock?"lock":""}" data-a="${a}"><input data-a="${a}" value="${esc(c.raw.startsWith("=")?fmt(v):c.raw)}" ${c.lock?"readonly":""}></td>`}h+="</tr>"}
  h+=`</table><div class="fbar"><button class="ghost" data-fill>${t_("fillDown")}</button><input data-fillto type="number" min="2" max="${def.rows}" value="${def.rows-1}" style="width:70px"></div>`;
  if(def.chart)h+=`<div class="fbar">${t_("chart")}: ${t_("labels")} <input data-cl value="${(def.chartDef||["A2:A7","D2:D7"])[0]}" style="width:80px"> ${t_("values")} <input data-cv value="${(def.chartDef||["A2:A7","D2:D7"])[1]}" style="width:80px"> <button class="ghost" data-chart>${t_("build")}</button></div><div data-chartout></div>`;
  return h+`<p class="small mute">${t_("formulaHint")}</p></div>`}

function bindSheet(w,box,r){const sid=box.dataset.sheet;let cur=null;
  const refresh=()=>{const cells=sheetCells(w,sid,r);const vals=evalSheet(cells);
    $$("input[data-a]",box).forEach(inp=>{const a=inp.dataset.a;if(document.activeElement===inp)return;const c=cells[a];inp.value=c.raw.startsWith("=")?fmt(vals[a]):c.raw})};
  $$("input[data-a]",box).forEach(inp=>{const a=inp.dataset.a;
    inp.onfocus=()=>{cur=a;$$("td",box).forEach(td=>td.classList.toggle("cur",td.dataset.a===a));$("[data-addr]",box).textContent=a;
      const raw=sheetCells(w,sid,r)[a].raw;$("[data-raw]",box).textContent=raw;if(!inp.readOnly)inp.value=raw};
    inp.oninput=()=>{$("[data-raw]",box).textContent=inp.value};
    inp.onblur=()=>{if(!inp.readOnly){r.sheets[sid][a]=inp.value.trim();Store.putRes(S.user.id,w.id,r)}refresh()};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const m=a.match(/([A-H])(\d+)/);const nx=$(`input[data-a="${m[1]}${+m[2]+1}"]`,box);inp.blur();if(nx)nx.focus()}}});
  $("[data-fill]",box).onmousedown=e=>e.preventDefault();
  $("[data-fill]",box).onclick=()=>{if(!cur)return;const def=w.sheets[sid];const to=Math.min(+$("[data-fillto]",box).value||0,def.rows);
    const src=sheetCells(w,sid,r)[cur].raw;const m=cur.match(/([A-H])(\d+)/);const r0=+m[2];
    for(let k=r0+1;k<=to;k++){const a=m[1]+k;if(a in def.lock)continue;r.sheets[sid][a]=src.startsWith("=")?shiftFormula(src,k-r0):src}
    Store.putRes(S.user.id,w.id,r);refresh()};
  const ch=$("[data-chart]",box);if(ch)ch.onclick=()=>{const vals=evalSheet(sheetCells(w,sid,r));
    const rng=s=>{const m=normRef(s).match(/^([A-H])(\d+):([A-H])(\d+)$/);if(!m)return[];const out=[];for(let i=+m[2];i<=+m[4];i++)out.push(m[1]+i);return out};
    const labs=rng($("[data-cl]",box).value),vs=rng($("[data-cv]",box).value);const data=vs.map((a,k)=>({l:labs[k]?String(vals[labs[k]]):a,v:typeof vals[a]==="number"?vals[a]:0}));
    $("[data-chartout]",box).innerHTML=barChart(data)};
  return refresh}

function barChart(data){if(!data.length)return "";const W=520,H=240,pad=50,max=Math.max(1,...data.map(d=>d.v)),min=Math.min(0,...data.map(d=>d.v));const bw=(W-pad-10)/data.length;
  const y=v=>H-30-(v-min)/(max-min)*(H-50);let s=`<svg viewBox="0 0 ${W} ${H}" style="max-width:${W}px;width:100%;background:#fff;border:1px solid #dde2ea;border-radius:8px">`;
  for(let k=0;k<=4;k++){const v=min+(max-min)*k/4;s+=`<line x1="${pad}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#eef1f5"/><text x="${pad-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#5d6678">${fmt(Math.round(v))}</text>`}
  data.forEach((d,k)=>{const x=pad+k*bw+bw*.15,yy=y(Math.max(d.v,0)),h=Math.abs(y(d.v)-y(0));s+=`<rect x="${x}" y="${d.v>=0?yy:y(0)}" width="${bw*.7}" height="${h}" rx="3" fill="#1f6feb"/><text x="${x+bw*.35}" y="${H-12}" text-anchor="middle" font-size="12" fill="#1d2433">${esc(d.l)}</text>`});
  return s+"</svg>"}

function collect(i,el){if(i.type==="tt"){const o={};$$("input[data-k]",el).forEach(x=>o[x.dataset.k]=x.value.trim());return o}
  if(i.type==="choice"){const x=$("input:checked",el);return x?+x.value:null}
  if(i.type==="multi")return $$("input:checked",el).map(x=>+x.value);
  if(i.type==="match")return $$("select",el).map(x=>x.value===""?null:+x.value);
  if(i.type==="num"){const x=$(".numin",el);return x?x.value:null}
  if(i.type==="text")return $("textarea",el).value;
  if(i.type==="str"){const x=$(".strin",el);return x?x.value:null}
  if(["code","sql","html","robot"].includes(i.type)){const x=$("[data-code]",el);return x?x.value:null}return null}

function bindWork(w,r){const refreshers={};$$("[data-item]").forEach(bindHint);
  $$("[data-sheet]").forEach(box=>refreshers[box.dataset.sheet]=bindSheet(w,box,r));
  if(COARSE)$$("table.tt input").forEach(x=>x.onclick=()=>{if(x.disabled)return;x.value=x.value===""?"0":x.value==="0"?"1":"0";x.classList.remove("right","wrong")});
  let saveT=null;const autosave=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{if(!S.cur||S.cur.w!==w||location.hash.slice(1)!=="w"+w.id)return;for(const i of itemsOf(w)){if(i.type==="sheet")continue;const el=$(`[data-item="${i.id}"]`);if(!el)continue;const st=r.items[i.id]=r.items[i.id]||{};if(!st.ok)st.ans=collect(i,el)}
    const rd=$("#r_done");if(rd)r.report={done:rd.value,concl:$("#r_concl").value,hard:$("#r_hard").value,self:$("#r_self").value};Store.putRes(S.user.id,w.id,r);const m=$("#autosave");if(m)m.textContent=t_("saved")+" "+new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})},800)};
  $("#app").addEventListener("input",e=>{if(!e.target.closest("[data-sheet]"))autosave()});$("#app").addEventListener("change",e=>{if(!e.target.closest("[data-sheet]"))autosave()});
  $("#app").addEventListener("click",e=>{if(COARSE&&e.target.matches("table.tt input"))autosave()});
  for(const i of itemsOf(w)){const el=$(`[data-item="${i.id}"]`);if(!el)continue;
    if(i.type==="code"){const ta=$("[data-code]",el);ta.onkeydown=e=>{if(e.key==="Tab"){e.preventDefault();const p0=ta.selectionStart;ta.setRangeText("    ",p0,ta.selectionEnd,"end")}};
      $("[data-run]",el).onclick=async()=>{const out=$("[data-out]",el);out.hidden=false;out.textContent=t_("pyLoading");
        try{const r_=await runPy(ta.value,$("[data-stdin]",el).value);out.textContent=r_.timeout?t_("timeout"):(r_.out===""?t_("noOutput"):r_.out)}catch(e){out.textContent=t_("pyFail")}}}
    if(i.type==="sql"){$("[data-run]",el).onclick=()=>{const o=$("[data-out]",el);try{o.innerHTML=sqlTableHTML(sqlRun($("[data-code]",el).value))}catch(e){o.innerHTML=`<div class="fb bad">${esc(e)}</div>`}}}
    if(i.type==="html"){const ta=$("[data-code]",el),fr=$("[data-prev]",el);let tm=null;const upd=()=>{fr.srcdoc=ta.value};upd();ta.addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(upd,400)});
      ta.onkeydown=e=>{if(e.key==="Tab"){e.preventDefault();ta.setRangeText("  ",ta.selectionStart,ta.selectionEnd,"end")}}}
    if(i.type==="robot"){$("[data-run]",el).onclick=()=>showRobot(i,el,checkItem(w,Object.assign({},i),{items:{[i.id]:{ans:$("[data-code]",el).value}}}))}
    if(i.type==="text"){$("[data-save]",el).onclick=async()=>{r.items[i.id]={ans:collect(i,el)};await Store.putRes(S.user.id,w.id,r);$("[data-fb]",el).innerHTML=`<div class="fb info">${t_("saved")}</div>`};continue}
    const btn=$("[data-check]",el);btn.onmousedown=e=>e.preventDefault();
    btn.onclick=async()=>{const st=r.items[i.id]=r.items[i.id]||{};if(i.type!=="sheet")st.ans=collect(i,el);st.att=(st.att||0)+1;
      let res;if(i.type==="code"){btn.disabled=true;res=await checkCode(i,el,st);btn.disabled=false;if(!res){st.att--;st.pending=true;await Store.putRes(S.user.id,w.id,r);return}st.pending=false}else res=checkItem(w,i,r);const k=st.att<=2?1:.5;const sc=Math.floor(i.pts*res.frac*k*2+1e-9)/2;st.score=Math.max(st.score||0,sc);st.ok=res.frac===1;
      await Store.putRes(S.user.id,w.id,r);
      if(res.marks){if(i.type==="tt")$$("input[data-k]",el).forEach(x=>{x.classList.toggle("right",!!res.marks[x.dataset.k]);x.classList.toggle("wrong",!res.marks[x.dataset.k])});
        if(i.type==="sheet")$$("td[data-a]",el).forEach(td=>{const a=td.dataset.a;td.classList.remove("right","wrong");if(a in res.marks)td.classList.add(res.marks[a]?"right":"wrong")});
        if(i.type==="html")$$("[data-checks] li",el).forEach((li,j)=>{li.style.color=res.marks[j]?"var(--ok)":"var(--bad)";li.textContent=(res.marks[j]?"✓ ":"✗ ")+L(i.checks[j].d)});
        if(i.type==="match")$$("select",el).forEach(x=>{x.classList.toggle("right",!!res.marks[x.dataset.k]);x.classList.toggle("wrong",!res.marks[x.dataset.k])})}
      {const sp=$("#rep .score");if(sp)sp.textContent=fmt(workScore(w,r))+" / "+maxPts(w)}
      const li=w.levels.findIndex(lv=>lv.includes(i));const before=$(`[data-lvdone="${li}"]`).textContent;
      if(i.type==="robot")showRobot(i,el,res);
      if(i.type==="sql"){const o=$("[data-out]",el);try{o.innerHTML=sqlTableHTML(sqlRun(st.ans||""))}catch(e){o.innerHTML=`<div class="fb bad">${esc(e)}</div>`}}
      $("[data-fb]",el).innerHTML=fbHTML(i,st);$("[data-att]",el).textContent=t_("attempts")+": "+st.att;bindHint(el);
      if(levelDone(w,r,li)&&!before){$(`[data-lvdone="${li}"]`).textContent="✓";confetti();$("[data-stars]").innerHTML=starsHTML(starsOf(w,r))}
      if(st.ok){$$("input,select",el).forEach(x=>{if(!x.closest("[data-sheet]"))x.disabled=true});btn.disabled=true}}}
  const rep=$("#rep");if(!rep)return;
  const readRep=()=>{r.report={done:$("#r_done").value,concl:$("#r_concl").value,hard:$("#r_hard").value,self:$("#r_self").value}};
  $$("#rep textarea,#rep select").forEach(x=>x.onchange=()=>{readRep();Store.putRes(S.user.id,w.id,r)});
  $("#r_submit").onclick=async()=>{readRep();if(!r.report.done.trim()||!r.report.concl.trim()){$("#r_err").textContent=t_("needFill");return}
    $("#r_err").textContent="";r.submitted=new Date().toISOString();await Store.putRes(S.user.id,w.id,r);viewWork(w.id)};
  $("#r_print").onclick=()=>{readRep();showReport(w,r,S.user)}}

function reportHTML(w,r){const p=r.report||{};const sc=workScore(w,r),mp=maxPts(w);
  return `<div class="card" id="rep"><h2 style="margin-top:0">${t_("report")}</h2>
  <p>${t_("autoScore")}: <span class="score">${fmt(sc)} / ${mp}</span></p>
  <label>${t_("rDone")}</label><textarea id="r_done">${esc(p.done||"")}</textarea>
  <label>${t_("rConcl")}</label><textarea id="r_concl">${esc(p.concl||"")}</textarea>
  <label>${t_("rHard")}</label><textarea id="r_hard" style="min-height:50px">${esc(p.hard||"")}</textarea>
  <label>${t_("self")}</label><select id="r_self"><option value="">—</option>${[1,2,3].map(k=>`<option value="${k}" ${p.self==k?"selected":""}>${t_("self"+k)}</option>`).join("")}</select>
  <div class="err" id="r_err"></div>
  <div class="row" style="margin-top:12px"><button id="r_submit">${r.submitted?t_("resubmit"):t_("submit")}</button><button class="sec" id="r_print">${t_("printRep")}</button>
  <span class="autosave" id="autosave"></span>${r.submitted?`<span class="small mute">${t_("submittedAt")}: ${new Date(r.submitted).toLocaleString("ru-RU")}</span>`:""}</div></div>`}

function ansText(w,i,r){const st=r.items[i.id]||{};const a=st.ans;
  if(i.type==="tt"){const c=checkItem(w,i,r);return `${c.ok} ${t_("of")} ${c.tot}`}
  if(i.type==="choice")return a==null?"—":L(i.opts[a]);
  if(i.type==="multi")return (a||[]).map(k=>L(i.opts[k])).join(", ")||"—";
  if(i.type==="match")return i.rows.map((row,k)=>L(row)+" → "+(a&&a[k]!=null?L(i.opts[a[k]]):"—")).join("; ");
  if(i.type==="num")return a||"—";
  if(i.type==="sheet"){const cells=sheetCells(w,i.sheet,r);const vals=evalSheet(cells);return i.checks.filter((c,k)=>k<4||c.cell.endsWith("8")).map(c=>`${c.cell}: ${cells[c.cell].raw||"—"} = ${fmt(vals[c.cell])}`).join("; ")+(i.checks.length>4?" …":"")}
  if(i.type==="text")return a||"—";
  if(["str","code","sql","html","robot"].includes(i.type))return a||"—";return ""}

function reportDoc(w,r,stu){const p=r.report||{};const sc=workScore(w,r),mp=maxPts(w);
  let h=`<h2 style="margin-top:0">${t_("report")}: ${pr()}-${w.n}. ${esc(L(w.title))}</h2><p>${esc(stu.name)} · ${esc(stu.cls||"")} · ${new Date().toLocaleDateString("ru-RU")}</p>
  <p>${t_("autoScore")}: <b>${fmt(sc)} / ${mp}</b> (${Math.round(sc/mp*100)}%)${r.mark?` · ${t_("mark")}: <b>${r.mark}</b>`:""}</p><h3>${t_("answers")}</h3><table class="matrix" style="width:100%">`;
  for(const i of itemsOf(w)){const st=r.items[i.id]||{};h+=`<tr><td class="name" style="white-space:normal;width:45%">${esc(L(i.q)).slice(0,160)}${L(i.q).length>160?"…":""}</td><td class="name" style="white-space:pre-wrap;${["code","sql","html","robot"].includes(i.type)?"font-family:ui-monospace,Consolas,monospace;font-size:13px":""}">${esc(ansText(w,i,r))}</td><td>${i.pts?(st.ok?"✓ ":"")+fmt(st.score||0)+"/"+i.pts:"—"}</td></tr>`}
  h+=`</table><h3>${t_("rDone")}</h3><p>${esc(p.done||"—")}</p><h3>${t_("rConcl")}</h3><p>${esc(p.concl||"—")}</p><h3>${t_("rHard")}</h3><p>${esc(p.hard||"—")}</p><p>${t_("self")}: ${p.self?t_("self"+p.self):"—"}</p>`;
  if(r.comment)h+=`<p>${t_("comment")}: ${esc(r.comment)}</p>`;return h}
function alertBox(msg){modal(`<p>${esc(msg)}</p><button id="m_close">OK</button>`);$("#m_close").onclick=closeModal}
function modal(html){$("#modal").innerHTML=`<div class="modal"><div class="box">${html}</div></div>`;$(".modal").onclick=e=>{if(e.target.classList.contains("modal"))closeModal()}}
function closeModal(){$("#modal").innerHTML=""}
function showReport(w,r,stu){modal(`<div id="repdoc">${reportDoc(w,r,stu)}</div><div class="row noprint" style="margin-top:12px"><button id="m_print">${t_("print")}</button><button class="sec" id="m_copy">${t_("copy")}</button><button class="ghost" id="m_close">${t_("close")}</button></div><p class="small mute noprint" id="m_msg"></p>`);
  $("#m_close").onclick=closeModal;
  $("#m_print").onclick=()=>{try{window.print()}catch(e){}setTimeout(()=>{$("#m_msg").textContent=t_("printBlocked")},300)};
  $("#m_copy").onclick=async()=>{try{await navigator.clipboard.writeText($("#repdoc").innerText);$("#m_msg").textContent=t_("copied")}catch(e){$("#m_msg").textContent="—"}}}

/* ============ Кабинет учителя ============ */
async function viewTeacher(){const cls=await Store.classesOf(S.user.id);S.tcls=S.tcls&&cls.some(c=>c.code===S.tcls)?S.tcls:(cls[0]&&cls[0].code);
  let h=`<h1>${t_("tCabinet")}</h1><div class="card"><h3 style="margin-top:0">${t_("newClass")}</h3><form id="nc" class="row"><input id="nc_name" placeholder="${t_("className")}"><select id="nc_g"><option>7</option><option>8</option><option>9</option></select><button>${t_("create")}</button></form></div>`;
  if(cls.length){h+=`<h2>${t_("myClasses")}</h2><div class="tabs" style="flex-wrap:wrap">${cls.map(c=>`<button data-c="${c.code}" class="${c.code===S.tcls?"on":""}">${esc(c.name)}</button>`).join("")}</div><div id="cls"></div>`}
  $("#app").innerHTML=h;
  $("#nc").onsubmit=async e=>{e.preventDefault();const n=$("#nc_name").value;if(!n.trim())return;try{const c=await Store.createClass(S.user.id,n,$("#nc_g").value);S.tcls=c.code;viewTeacher()}catch(x){alertBox(String(x))}};
  $$("[data-c]").forEach(b=>b.onclick=()=>{S.tcls=b.dataset.c;viewTeacher()});
  if(S.tcls)drawClass(cls.find(c=>c.code===S.tcls))}
async function drawClass(c){const st=await Store.studentsOf(c.code);const works=allWorks(c.grade).filter(w=>!w.soon);
  let h=`<div class="card"><p><b>${esc(c.name)}</b> · ${c.grade} ${t_("grade")} · ${t_("classCode")}: <b style="font-size:20px;letter-spacing:1px">${c.code}</b></p><p class="small mute">${t_("codeHint")}</p>`;
  if(!st.length){$("#cls").innerHTML=h+`<p>${t_("noStudents")}</p></div>`;return}
  const allR=await Store.classResults(c.code);const rows=st.map(s=>({s,res:allR[s.id]||{}}));
  h+=`<div style="overflow-x:auto"><table class="matrix"><tr><th>${t_("fio")}</th>${works.map(w=>`<th title="${esc(L(w.title))}">${pr()}-${w.n}</th>`).join("")}</tr>`;
  for(const {s,res} of rows){h+=`<tr><td class="name">${esc(s.name)}</td>`;
    for(const w of works){const r=res[w.id];let v="—";if(r){const sc=workScore(w,r);v=`${r.submitted?"✓":"◐"} ${fmt(sc)}${r.mark?` (${r.mark})`:""}`}h+=`<td class="cell" data-s="${s.id}" data-w="${w.id}">${v}</td>`}h+="</tr>"}
  h+=`</table></div><p class="small mute">${t_("legend")}</p><div class="row"><button class="sec" id="csv">${t_("csv")}</button><span class="small mute" id="csvmsg"></span></div></div>`;
  $("#cls").innerHTML=h;
  $$("td.cell").forEach(td=>td.onclick=()=>openStudentWork(c,rows.find(x=>x.s.id===td.dataset.s).s,findWork(td.dataset.w)));
  $("#csv").onclick=async()=>{const lines=[["ФИО",...works.map(w=>"ПР-"+w.n+" авто"),...works.map(w=>"ПР-"+w.n+" оценка")].join(";")];
    for(const {s,res} of rows)lines.push([s.name,...works.map(w=>res[w.id]?String(workScore(w,res[w.id])).replace(".",","):""),...works.map(w=>res[w.id]&&res[w.id].mark||"")].join(";"));
    const txt="﻿"+lines.join("\r\n");
    try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv"}));a.download=c.name+"_"+c.code+".csv";document.body.appendChild(a);a.click();a.remove()}catch(e){}
    try{await navigator.clipboard.writeText(txt.slice(1));$("#csvmsg").textContent=t_("copied")}catch(e){}}}
async function openStudentWork(c,s,w){const r=await Store.getRes(s.id,w.id);const sc=workScore(w,r),mp=maxPts(w);const sug=markFrom(sc/mp*100);
  modal(`<div id="repdoc">${reportDoc(w,r,s)}</div><div class="card noprint"><p class="small mute">${t_("suggested")}: <b>${sug}</b> (${Math.round(sc/mp*100)}%)</p>
  <div class="row"><label style="margin:0">${t_("mark")}</label><select id="m_mark"><option value="">—</option>${[5,4,3,2].map(k=>`<option ${r.mark==k?"selected":""}>${k}</option>`).join("")}</select></div>
  <label>${t_("comment")}</label><textarea id="m_com">${esc(r.comment||"")}</textarea>
  <div class="row" style="margin-top:8px"><button id="m_save">${t_("save")}</button><button class="ghost" id="m_close">${t_("close")}</button><span class="small mute" id="m_msg"></span></div></div>`);
  $("#m_close").onclick=closeModal;
  $("#m_save").onclick=async()=>{const mk=$("#m_mark").value?+$("#m_mark").value:null,cm=$("#m_com").value.trim();try{await Store.setMark(s.id,w.id,mk,cm);closeModal();drawClass(c)}catch(e){$("#m_msg").textContent=String(e)}}}

route();
</script>
